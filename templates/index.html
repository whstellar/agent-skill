<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>book2md · PDF/EPUB 转 Markdown 发布到 GitHub</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --border:#e2e5ea; --primary:#2563eb; --primary-d:#1d4ed8; --text:#1f2937; --muted:#6b7280; --ok:#16a34a; --warn:#d97706; --err:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--border); padding:16px 24px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  .wrap { max-width:960px; margin:20px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:16px; }
  .card h2 { margin:0 0 12px; font-size:15px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input[type=text], input[type=password], input[type=file], select, textarea {
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:7px; font-size:14px; background:#fff; color:var(--text);
  }
  textarea { resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; min-height:300px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:200px; }
  button { background:var(--primary); color:#fff; border:none; border-radius:7px; padding:9px 16px; font-size:14px; cursor:pointer; }
  button:hover { background:var(--primary-d); }
  button.ghost { background:#fff; color:var(--primary); border:1px solid var(--primary); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .book { border:1px solid var(--border); border-radius:9px; padding:14px; margin-bottom:12px; background:#fafbfc; }
  .book .meta { display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:8px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:20px; background:#eef2ff; color:var(--primary); }
  .log { background:#0f172a; color:#e2e8f0; font-family:ui-monospace,monospace; font-size:12px; padding:12px; border-radius:7px; max-height:300px; overflow:auto; white-space:pre-wrap; }
  .log .skip { color:#fbbf24; }
  .log .err { color:#f87171; }
  .log .ok { color:#4ade80; }
  .status { font-size:13px; margin-top:8px; }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  .topbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
</style>
</head>
<body>
<header>
  <h1>book2md · 电子书转 Markdown 发布工具</h1>
  <p>本地上传 PDF / EPUB → 转成 Markdown → 发布到你指定的 GitHub 仓库（按书名分目录，追加不覆盖）</p>
</header>

<div class="wrap">

  <div class="card">
    <h2>① GitHub 与仓库设置</h2>
    <label>Personal Access Token（仅需 repo 权限，不会保存到任何地方）</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxx" autocomplete="off" />
    <div class="hint">在 GitHub → Settings → Developer settings → PAT 生成，勾选 repo 权限。</div>

    <div class="row">
      <div>
        <label>仓库名（可带 owner，如 owner/my-books 或仅 my-books）</label>
        <input type="text" id="repo" placeholder="my-ebooks" />
      </div>
      <div>
        <label>仓库可见性</label>
        <select id="visibility">
          <option value="private">私有 Private</option>
          <option value="public">公开 Public</option>
        </select>
      </div>
    </div>
    <div class="hint">仓库不存在时会自动创建；已存在则向其中追加书籍。</div>
  </div>

  <div class="card">
    <h2>② 上传并转换文件</h2>
    <input type="file" id="fileInput" accept=".pdf,.epub" multiple />
    <div class="hint">支持多选。每个文件会先转换为 Markdown，你可编辑后再发布。</div>
    <div id="bookList"></div>
  </div>

  <div class="card">
    <h2>③ 发布日志</h2>
    <button id="publishAll" class="ghost" disabled>发布全部已转换书籍</button>
    <div id="globalStatus" class="status"></div>
    <div id="log" class="log" style="margin-top:10px;">（暂无）</div>
  </div>

</div>

<script>
const books = []; // {job_id, orig_name, md, imgCount, folder, status}

function slugify(name){
  return (name||"book").replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]/g,'-').trim() || "book";
}

function renderBooks(){
  const list = document.getElementById('bookList');
  list.innerHTML = '';
  books.forEach((b, i)=>{
    const el = document.createElement('div');
    el.className = 'book';
    el.innerHTML = `
      <div class="meta">
        <span><b>${escapeHtml(b.orig_name)}</b> ${b.imgCount? '· '+b.imgCount+' 张图':''}</span>
        <span class="badge" id="badge-${i}">${b.status||'待转换'}</span>
      </div>
      <div class="row">
        <div>
          <label>书名目录（用于仓库内文件夹名）</label>
          <input type="text" id="folder-${i}" value="${escapeHtml(b.folder)}" />
        </div>
      </div>
      <label>Markdown 预览 / 可编辑</label>
      <textarea id="md-${i}" placeholder="转换后显示在此">${escapeHtml(b.md||'')}</textarea>
      <div style="margin-top:8px; display:flex; gap:8px;">
        <button id="conv-${i}">${b.job_id?'重新转换':'转换'}</button>
        <button class="ghost" id="pub-${i}" ${b.job_id?'':'disabled'}>发布此书</button>
      </div>
    `;
    list.appendChild(el);
    document.getElementById('conv-'+i).onclick = ()=>convert(i);
    document.getElementById('pub-'+i).onclick = ()=>publishOne(i);
  });
  document.getElementById('publishAll').disabled = !books.some(b=>b.job_id);
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function convert(i){
  const b = books[i];
  const input = document.createElement('input');
  input.type='file'; input.accept='.pdf,.epub';
  // 用隐藏 file 重新选不友好；改为：转换时若还没有 File 对象则提示先选
  if(!b._file){ alert('请先在上方文件选择框选择该文件（当前版本每次选择即自动加入列表）'); return; }
  setBadge(i,'转换中…');
  const fd = new FormData(); fd.append('file', b._file);
  try{
    const r = await fetch('/api/convert',{method:'POST',body:fd});
    const data = await r.json();
    if(!r.ok) throw new Error(data.detail||'转换失败');
    b.job_id = data.job_id; b.md = data.markdown; b.imgCount = data.image_count; b.folder = slugify(b.orig_name);
    setBadge(i,'已转换');
    renderBooks();
  }catch(e){ setBadge(i,'失败'); alert('转换失败: '+e.message); }
}

function setBadge(i,t){ const el=document.getElementById('badge-'+i); if(el) el.textContent=t; }

async function publishOne(i){
  const b = books[i];
  if(!b.job_id){ alert('请先转换'); return; }
  const token = document.getElementById('token').value.trim();
  const repo = document.getElementById('repo').value.trim();
  const vis = document.getElementById('visibility').value;
  if(!token||!repo){ alert('请先填写 Token 与仓库名'); return; }
  b.folder = document.getElementById('folder-'+i).value.trim() || slugify(b.orig_name);
  b.md = document.getElementById('md-'+i).value;
  const fd = new FormData();
  fd.append('job_id', b.job_id);
  fd.append('token', token);
  fd.append('repo', repo);
  fd.append('book_folder', b.folder);
  fd.append('markdown', b.md);
  fd.append('private', vis==='private');
  logLine('→ 发布《'+b.folder+'》到 '+repo+' …');
  try{
    const r = await fetch('/api/publish',{method:'POST',body:fd});
    const data = await r.json();
    if(!r.ok) throw new Error(data.detail||'发布失败');
    showSummary(data);
  }catch(e){ logLine('✗ '+e.message, 'err'); }
}

async function publishAll(){
  const token = document.getElementById('token').value.trim();
  const repo = document.getElementById('repo').value.trim();
  if(!token||!repo){ alert('请先填写 Token 与仓库名'); return; }
  for(let i=0;i<books.length;i++){ if(books[i].job_id) await publishOne(i); }
}

function showSummary(data){
  logLine('✔ 仓库: '+data.repo+(data.created_repo?'（已新建）':''), 'ok');
  logLine('  上传 '+data.uploaded.length+' 个文件，跳过 '+data.skipped.length+' 个，失败 '+data.failed.length+' 个');
  data.log.forEach(l=>{
    const cls = l.startsWith('[跳过]')?'skip':(l.startsWith('[失败]')?'err':'ok');
    logLine(l, cls);
  });
}

function logLine(t, cls){
  const el = document.getElementById('log');
  const span = document.createElement('div');
  if(cls) span.className = cls;
  span.textContent = t;
  el.appendChild(span); el.scrollTop = el.scrollHeight;
}

document.getElementById('fileInput').addEventListener('change', e=>{
  Array.from(e.target.files).forEach(f=>{
    books.push({ orig_name:f.name, _file:f, md:'', imgCount:0, folder:slugify(f.name), status:'待转换', job_id:null });
  });
  e.target.value='';
  renderBooks();
});

document.getElementById('publishAll').onclick = publishAll;
renderBooks();
</script>
</body>
</html>
