                  body: JSON.stringify({ content: e.b64, encoding: 'base64' })
                });
                out.push({ path: e.path, mode: '100644', type: 'blob', sha: again.sha });
                doneAll++;
                break;
              }catch(e2){
                if (attempt === 3){ log(`  [失败] ${e.path}：${e2.friendly || e2.message}`, 'err'); break; }
                await sleep(2000 * attempt);
              }
            }
            continue;
          }
          log(`  [失败] ${e.path}：${err.friendly || err.message}`, 'err');
        }
      }
    };
    await Promise.all(Array.from({ length: Math.min(slice, chunk.length) }, worker));
    return out;
  };

  // 分片步长固定，只让片内并发数变化：
  // 若跟着 slice 变化走，会漏文件或重复传。
  const STEP = 12;
  for(let off = 0; off < entries.length; off += STEP){
    const chunk = entries.slice(off, off + STEP);
    const got = await uploadSlice(chunk);
    blobs.push(...got);
    // 连续整片成功到阈值就加一档（不超过上限）
    streak++;
    if(streak >= 3 && slice < MAX_SLICE){ slice++; streak = 0; }
  }

  const refs = (extra && extra.refs) || [];   // 引用已有 blob（改名）
  const dels = (extra && extra.dels) || [];   // 删除（sha 置 null）
  if(!blobs.length && !refs.length && !dels.length) return { committed: 0, failed: entries.length };

  const treeEntries = blobs
    .concat(refs.map(r => ({ path: r.path, mode: '100644', type: 'blob', sha: r.sha })))
    .concat(dels.map(p => ({ path: p, mode: '100644', type: 'blob', sha: null })));

  // 读 ref → 建 tree → 建 commit → 移 ref：整个过程放进串行区，
  // 分支头必须在锁内现取（锁外读的 sha 建 blob 期间就过期了）。
  await serialize(() => withRetry(async () => {
    const parentSha = await readHeadRef(token, base, info);
    const tree = await gh(token, base + '/trees', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base_tree: parentSha, tree: treeEntries })
    });
    const commit = await gh(token, base + '/commits', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: commitMessage, tree: tree.sha, parents: [parentSha] })
    });
    // 分支名可能刚被 readHeadRef 纠正过，PATCH 必须用纠正后的名字
    return gh(token, `${base}/refs/heads/${encodeURIComponent(info.default_branch)}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sha: commit.sha, force: false })
    });
  }, { tries: 4, label: '提交' }));

  return { committed: blobs.length, failed: entries.length - blobs.length, refs: refs.length, dels: dels.length };
}

/** 逐文件上传（批量提交的降级路径） */
async function putFile(token, info, path, base64, message, knownSha){
  const url = `https://api.github.com/repos/${info.full}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
  const resolveSha = async () => {
    if(knownSha === false) return false;
    if(typeof knownSha === 'string' && knownSha) return knownSha;
    try{ const cur = await gh(token, url); return cur.sha || true; }
    catch(e){ if(e.status === 404) return false; throw e; }
  };
  return serialize(() => withRetry(async () => {
    const sha = await resolveSha();
    const body = { message, content: base64, branch: info.default_branch };
    if(typeof sha === 'string') body.sha = sha;
    return gh(token, url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }, { tries: 4, label: path }));
}

async function uploadFilesIndividually(token, info, todo, existing){
  let up = 0, fail = 0;
  for(let i = 0; i < todo.length; i++){
    const f = todo[i];
    progSet(i / todo.length * 100);
    const isUpdate = !!(existing && existing.has(f.path));
    const known = existing ? (existing.has(f.path) ? existing.get(f.path) : false) : undefined;
    try{
      await putFile(token, info, f.path, f.b64, `${isUpdate ? 'update' : 'add'} ${f.path}`, known);
      if(existing) existing.set(f.path, null);
      up++;
    }catch(e){ fail++; log(`  [失败] ${f.path}：${e.friendly || e.message}`, 'err'); }
  }
  return { up, fail, skip: 0 };
}

/* =========================================================================
   10. 上传编排
   ========================================================================= */
async function updateReadme(token, info){
  const files = await listAllFiles(token, info);
  const booksMap = new Map();
  for(const f of files){
    const i = f.path.indexOf('/');
    if(i < 0) continue;
    const dir = f.path.slice(0, i);
    if(dir === 'images' || dir === '.github') continue;
    if(!booksMap.has(dir)) booksMap.set(dir, { md:false, pdf:false, epub:false, cover:null, images:0, kb:0 });
    const rec = booksMap.get(dir);
    const rest = f.path.slice(i + 1);
    const bn = baseName(f.path);
    if(/\.md$/i.test(bn) && bn === dir + '.md'){ rec.md = true; rec.kb += f.size || 0; }
    else if(/\.pdf$/i.test(bn) && bn === dir + '.pdf') rec.pdf = true;
    else if(/\.epub$/i.test(bn) && bn === dir + '.epub') rec.epub = true;
    else if(/^cover\.(jpe?g|png|webp|gif|svg)$/i.test(bn) && !rest.includes('/')) rec.cover = bn;
    else if(rest.startsWith('images/')) rec.images++;
  }
  // 书库索引：书名/作者/出版社/字数/封面，由上传时写入
  let libIndex = {};
  try{
    const idxFile = files.find(x => x.path === 'books.json');
    const txt = await readRepoText(token, info, 'books.json', idxFile ? idxFile.sha : '');
    if(txt) libIndex = JSON.parse(txt) || {};
  }catch(e){ /* 没有索引就按文件夹名显示，不影响 README 生成 */ }

  const rows = [...booksMap.entries()].sort((a, b) => a[0].localeCompare(b[0], 'zh'));
  /* 链接用的路径：只编码真正会破坏 Markdown/URL 的字符，中文原样保留。
     encodeURIComponent 会把整串中文变成 %E7%BA%A2… —— 能用，但 README 源码没法读，
     用户想手改一条链接都无从下手。 */
  const mdUrl = p => String(p).split('/').map(seg =>
    seg.replace(/[\s()<>#%?\[\]&"'`]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase().padStart(2, '0'))
  ).join('/');
  const totalImages = rows.reduce((a, [, r]) => a + r.images, 0);
  const totalChars = rows.reduce((a, [d]) => a + (Number((libIndex[d] || {}).chars) || 0), 0);

  // 表格单元格里的文本：先转义 HTML，再转义竖线（否则会把表格切断）
  const cell = s => escapeHtml(String(s == null ? '' : s)).replace(/\|/g, '\\|');

  /* 页首打上生成时间。没有这一行，"首页到底刷没刷新"就只能靠翻 commit 历史猜 ——
     而 GitHub 目录列表显示的是**该目录里文件最后一次被修改**的时间，
     只重建 README 是不碰这些文件的，目录时间当然不会变，很容易被误读成"没上传"。 */
  const now = new Date();
  const two = n => String(n).padStart(2, '0');
  const stamp = now.getFullYear() + '-' + two(now.getMonth() + 1) + '-' + two(now.getDate()) +
                ' ' + two(now.getHours()) + ':' + two(now.getMinutes());

  /* 标题用仓库名，不写死。这个工具不止用来放「Skill」，
     写死一个名字会让别人 clone 过去之后首页文不对题。 */
  const title0 = String(info.repo || '')
    .replace(/[-_]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim() || '书库';

  let md = '<div align="center">\n\n# ' + title0 + '\n\n';
  md += '共 **' + rows.length + '** 个';
  if(totalChars) md += ' · 约 **' + fmtChars(totalChars) + '**';
  md += ' · **' + totalImages + '** 张配图\n\n';
  md += '<sub>最近更新 ' + stamp + '</sub>\n\n</div>\n\n';
  md += '每本书一个目录：**目录名/cover.xxx**（封面）、**目录名/目录名.md**（正文）、'
      + '**目录名/images/**（配图）。\n\n';
  md += '> GitHub 上直接点开 `.md` 就能读；想要原书就下 `.epub`。\n\n';
  /* 小标题同样不写死「技能列表」—— 主标题已经跟着仓库名走了，
     下面还挂着个「技能列表」会让人以为这个仓库只能放那一种东西。 */
  md += '---\n\n## 书目\n\n';
  md += '| 封面 | 名称 | 文件 | 规模 |\n|:---:|---|---|---|\n';

  for(const [dir, r] of rows){
    const meta = libIndex[dir] || {};
    const title = String(meta.title || '').trim() || dir;
    const u = mdUrl(dir);

    /* 只认仓库里真实扫到的封面文件。books.json 里记着名字、但文件没传上去或已被删时，
       再照着索引写一个 <img> 就是一张裂图 —— 不如老实显示「无封面」，一眼能看出有问题。 */
    const coverFile = r.cover || '';
    const shot = coverFile
      ? '<img src="' + u + '/' + mdUrl(coverFile) + '" width="76" alt="' + cell(title) + '">'
      : '<sub>无封面</sub>';

    const titleCell = r.md
      ? '<a href="' + u + '/' + u + '.md"><b>' + cell(title) + '</b></a>'
      : '<b>' + cell(title) + '</b>';
    const subBits = [];
    if(meta.author) subBits.push(cell(meta.author));
    if(meta.publisher) subBits.push(cell(meta.publisher));
    const nameCell = titleCell + (subBits.length ? '<br><sub>' + subBits.join(' · ') + '</sub>' : '');

    const dl = [];
    if(r.md)   dl.push('[md](' + u + '/' + u + '.md)');
    if(r.pdf)  dl.push('[pdf](' + u + '/' + u + '.pdf)');
    if(r.epub) dl.push('[epub](' + u + '/' + u + '.epub)');

    const sizeBits = [];
    if(meta.chars) sizeBits.push(fmtChars(meta.chars));
    if(r.images) sizeBits.push(r.images + ' 图');
    if(!meta.chars && r.kb) sizeBits.push(fmtSize(r.kb));
    /* books.json 里记着这本书是哪天传的，顺手显示出来 ——
       以后不用再去点开文件夹看时间戳。老书没有这条记录就不显示。 */
    if(meta.updated) sizeBits.push('<sub>' + cell(meta.updated) + '</sub>');

    md += '| ' + shot + ' | ' + nameCell + ' | ' + (dl.join(' · ') || '—') +
          ' | ' + (sizeBits.join('<br>') || '—') + ' |\n';
  }
  /* 页脚带上版本号。首页是自动重建的，出问题时第一件事就是
     确认"这份 README 是哪一版工具生成的" —— 写在这里一眼就能看到。 */
  const ver = (document.documentElement && document.documentElement.dataset.v) || '';
  md += '\n---\n\n> 本文件由 book2md ' + (ver ? 'v' + ver + ' ' : '')
      + '自动维护，每次上传后自动重建\n';

  // 让"封面到底识别到几个"这件事可见，而不是等用户去首页数
  const withCover = rows.filter(([, r]) => r.cover).length;
  const noCover = rows.filter(([, r]) => !r.cover).map(([d]) => d);
  log(`  [README] ${rows.length} 个条目，${withCover} 个有封面` +
      (noCover.length ? `；无封面：${noCover.slice(0, 5).join('、')}${noCover.length > 5 ? ' 等' : ''}` : ''),
      noCover.length ? 'warn' : 'ok');

  /* 没封面的目录，把它顶层实际有哪些文件列出来。
     一眼就能分清是「封面压根没传上去」还是「有图但名字不叫 cover.*」。 */
  for(const d of noCover.slice(0, 3)){
    const names = files
      .filter(f => f.path.startsWith(d + '/') && !f.path.slice(d.length + 1).includes('/'))
      .map(f => baseName(f.path));
    log(`    ${d}/ 顶层文件：${names.length ? names.join('、') : '（空）'}`, 'info');
  }

  // README 更新同样会移动分支引用，必须串行化，且分支头在锁内现取
  const base = `https://api.github.com/repos/${info.full}/git`;
  return serialize(() => withRetry(async () => {
    const parentSha = await readHeadRef(token, base, info);
    const blob = await gh(token, base + '/blobs', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: bytesToBase64(enc.encode(md)), encoding: 'base64' })
    });
    /* 顺手把 .gitattributes 写进同一个 commit —— 不额外多花一次 API 调用。
       它解决两件只看 GitHub 主页就能发现的事：
         ① 语言条被资源文件带偏：SVG 属于 markup 语言，会被 linguist 计入统计，
            一仓库自动生成的 cover.svg 能把语言条顶成「SVG 98%」，看着像个前端项目；
         ② 传书时 diff 刷屏：几百张图片会列出几百条二进制改动。 */
    const gaBlob = await gh(token, base + '/blobs', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: bytesToBase64(enc.encode(gitattributesText())), encoding: 'base64' })
    });
    const tree = await gh(token, base + '/trees', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base_tree: parentSha, tree: [
      { path: 'README.md', mode: '100644', type: 'blob', sha: blob.sha },
      { path: '.gitattributes', mode: '100644', type: 'blob', sha: gaBlob.sha }
    ] })
    });
    const commit = await gh(token, base + '/commits', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'update README book index', tree: tree.sha, parents: [parentSha] })
    });
    // 分支名可能刚被 readHeadRef 纠正过，PATCH 必须用纠正后的名字
    await gh(token, `${base}/refs/heads/${encodeURIComponent(info.default_branch)}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sha: commit.sha, force: false })
    });
    return { commit: commit.sha, bytes: enc.encode(md).length, entries: rows.length };
  }, { tries: 4, label: '更新 README' }));
}

/** 需要时才把 EPUB 原件编成 base64。
 *
 *  不能放在转换完成时算：实测 20MB → 157ms、常驻 53MB（base64 在 JS 里按 UTF-16 存，
 *  是原体积的 2.6 倍），90MB 的书就是约 700ms + 约 240MB —— 而"保留原件"默认是关的，
 *  那份 base64 根本不会上传。改成上传时才算，不勾就一分内存都不占。
 */
async function ensureOrigB64(b){
  if(!b || b.kind !== 'epub' || !b.keepOrig || b.origB64 || !b.file) return (b && b.origB64) || '';
  try{
    const ab = await b.file.arrayBuffer();
    b.origB64 = bytesToBase64(new Uint8Array(ab));
  }catch(e){
    b.origB64 = null;
  }
  return b.origB64 || '';
}

async function uploadBook(b){
  const token = $('token').value.trim();
  const repoInput = $('repo').value.trim();
  if(!token) throw new Error('缺少 GitHub Token');
  if(!repoInput) throw new Error('缺少仓库名');

  const folder = safeFolder(b.folder);
  const isPrivate = $('visibility').checked;
  log(`▶ [${b.name}] 目标仓库：${repoInput}`, 'info');

  const repoKey = repoInput.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  let info = (sharedRepoInfo && sharedRepoInfo.key === repoKey) ? sharedRepoInfo : null;
  if(!info){
    info = await ensureRepo(token, repoInput, isPrivate);
    info.key = repoKey;
    sharedRepoInfo = info;
    if(info.created) log(`  已创建仓库 ${info.full}`, 'ok');
  }

  const existing = await listPaths(token, info);

  /* 保留原件：base64 到这里才懒算（转换时算太亏，见 convertBook() 的注释）。
     用户也可能在"加完书之后"才勾上这个框 —— 那时 b.origB64 是空的，所以每次都重新确认一遍。 */
  if(b.kind === 'epub' && b.keepOrig && !b.origB64 && b.file && !(await ensureOrigB64(b))){
    log('  [提醒] 读原件失败，这次不上传 EPUB 原件', 'warn');
  }

  // 组装文件（带原始字节用于本地算 sha）
  const files = [];
  if(b.kind === 'pdf'){
    files.push({ path: `${folder}/${folder}.pdf`, b64: b.base64, bytes: b.base64 ? b64ToBytes(b.base64) : null });
  }else{
    files.push({ path: `${folder}/${folder}.md`, b64: b.base64, bytes: b.base64 ? b64ToBytes(b.base64) : null });
    for(const [name, bytes] of b.images) files.push({ path: `${folder}/images/${name}`, b64: bytesToBase64(bytes), bytes });
    if(b.keepOrig && b.origB64) files.push({ path: `${folder}/${folder}.epub`, b64: b.origB64, bytes: b64ToBytes(b.origB64) });
  }

  /* 封面：有真封面就用真的，没有就生成一张文字封面。
     PDF 和直接上传的 .md 本来就不带封面（封面只从 EPUB 的 OPF 里取），
     以前这种书在 README 里只能写「无封面」，一排书看过去像坏了几本。
     现在统一补一张 SVG —— 文件名仍是 cover.*，README 的扫描规则不用改。 */
  let coverName = '';
  if(b.cover && b.cover.bytes && b.cover.bytes.length){
    const ext = (b.cover.name.match(/\.[a-z0-9]+$/i) || ['.jpg'])[0].toLowerCase();
    coverName = 'cover' + ext;
    files.push({ path: `${folder}/${coverName}`, b64: bytesToBase64(b.cover.bytes), bytes: b.cover.bytes });
  }else{
    const svgBytes = enc.encode(makeTextCover((b.meta && b.meta.title) || folder, b.kind));
    coverName = 'cover.svg';
    files.push({ path: `${folder}/${coverName}`, b64: bytesToBase64(svgBytes), bytes: svgBytes });
    log(`  [封面] 源文件本身不带封面，已生成文字封面 ${coverName}`, 'info');
  }
  b.coverFile = coverName;

  /* 书籍目录页：GitHub 打开 `书名/` 时会自动渲染它。
     没有它，目录页就是一列文件名 —— 封面缩略图、作者、下载入口全看不见，
     想下载还得先点进正文再从里面找链接。 */
  const pageText = bookPageMd(b, folder, coverName, new Date().toISOString().slice(0, 10));
  const pageBytes = enc.encode(pageText);
  files.push({ path: `${folder}/README.md`, b64: bytesToBase64(pageBytes), bytes: pageBytes });

  /* 书库索引：books.json 记下每本书的书名 / 作者 / 封面文件名。
     README 靠它把「这是哪本书」写清楚，而不是只露出一个规范化后的文件夹名。
     只合并自己这一条，别人的条目原样保留；读不到就重建，不影响书籍上传。 */
  let libIndex = {};
  try{
    const idxSha = existing ? (existing.get('books.json') || '') : '';
    const txt = await readRepoText(token, info, 'books.json', idxSha);
    if(txt) libIndex = JSON.parse(txt) || {};
  }catch(e){ /* 文件不存在或不是合法 JSON：重建一份即可 */ }

  libIndex[folder] = {
    title: String((b.meta && b.meta.title) || folder).trim(),
    author: (b.meta && b.meta.creator) || '',
    publisher: (b.meta && b.meta.publisher) || '',
    language: (b.meta && b.meta.language) || '',
    chars: (b.markdown || '').length,
    images: b.images.length,
    cover: coverName || '',
    pdf: b.kind === 'pdf',
    epub: b.kind === 'epub' && !!b.keepOrig,
    /* 上面这一条要等 origB64 就绪才准：懒算放在这里的原因见 convertBook() 的注释 */
    updated: new Date().toISOString().slice(0, 10)
  };
  const idxBytes = enc.encode(JSON.stringify(libIndex, null, 2) + '\n');
  files.push({ path: 'books.json', b64: bytesToBase64(idxBytes), bytes: idxBytes });

  let up = 0, skip = 0, fail = 0;
  /* 跳过分两种，必须分开统计 —— 混在一起会让日志说假话：
       same  = 内容真的一个字节都没变（跳过是对的）
       held  = 内容**变了**，但被「已存在文件跳过不覆盖」那个开关挡住了（这是个坑）
     以前只要勾了开关就直接 continue，压根不比对，日志却统一写"内容未变"，
     导致"改了转换逻辑 → 重传 → 看着成功 → GitHub 上一点没变"这种鬼打墙。 */
  let skipSame = 0, heldFiles = [];
  const MAX_BYTES = 90 * 1024 * 1024;
  const todo = [];

  for(const f of files){
    if(existing && existing.has(f.path)){
      // 先比对 sha（纯本地计算，不花 API 调用），再决定要不要被开关挡住
      let same = false;
      if(f.bytes){
        try{ same = gitBlobSha1(f.bytes) === existing.get(f.path); }catch(e){}
      }
      if(same){ skip++; skipSame++; continue; }
      if(b.skipExisting){ skip++; heldFiles.push(f.path); continue; }
    }
    if(typeof f.b64 !== 'string' || !f.b64.length){ fail++; log(`  [失败] ${f.path}：内容为空`, 'err'); continue; }
    const approx = Math.floor(f.b64.length * 3 / 4);
    if(approx > MAX_BYTES){ fail++; log(`  [失败] ${f.path}：约 ${fmtSize(approx)}，超过 100MB 限制`, 'err'); continue; }
    todo.push(f);
  }
  if(skipSame) log(`  ${skipSame} 个文件与仓库完全一致，跳过上传`, 'ok');
  // 记下"没变"的是哪几个，上传结束后能直接说清"这本书为什么没动"
  const sameFiles = files.filter(f => existing && existing.has(f.path) && !todo.includes(f) && !heldFiles.includes(f.path))
                          .map(f => f.path);
  if(heldFiles.length){
    log(`  ${heldFiles.length} 个文件内容和仓库**不一样**，但被「已存在文件跳过不覆盖」挡住了，没有提交`, 'warn');
    log(`    ${heldFiles.slice(0, 6).join('、')}${heldFiles.length > 6 ? ' 等' : ''}`, 'info');
    log(`    想让它们更新：取消勾选「已存在文件跳过不覆盖」，再传一次`, 'warn');
  }

  if(todo.length){
    if(useBatchCommit){
      try{
        const r = await commitFilesBatch(token, info, todo, `${b.skipExisting ? 'update' : 'add'} ${folder}（${todo.length} 个文件）`);
        up += r.committed; fail += r.failed;
        log(`  ✔ 已提交 ${r.committed} 个文件（1 个 commit）`, 'ok');
      }catch(e){
        log(`  批量提交失败（${e.friendly || e.message}），改为逐文件上传`, 'warn');
        up = 0;
        const per = await uploadFilesIndividually(token, info, todo, existing);
        up += per.up; fail += per.fail; skip += per.skip;
      }
    }else{
      const per = await uploadFilesIndividually(token, info, todo, existing);
      up += per.up; fail += per.fail; skip += per.skip;
    }
  }

  try{
    const r = await updateReadme(token, info);
    log(`  [更新] README.md：${r.entries} 个条目，commit ${String(r.commit).slice(0, 7)}`, 'ok');
  }catch(e){
    log(`  [提示] README 生成失败（不影响书籍上传）：${e.friendly || e.message}`, 'warn');
  }

  let tail = `✔ [${b.name}] 完成：上传 ${up}，跳过 ${skip}，失败 ${fail}`;
  if(heldFiles.length) tail += `（其中 ${heldFiles.length} 个是"该更新但被设置挡住"，不是真的没变化）`;
  log(tail, fail || heldFiles.length ? 'err' : 'ok');
  if(!up && !fail && heldFiles.length){
    log(`  ⚠ 这次上传其实没有向仓库提交任何内容，GitHub 上的时间自然不会变`, 'warn');
  }
  return { uploaded: up, skipped: skip, failed: fail, held: heldFiles.length, sameFiles };
}

/* =========================================================================
   11. UI
   ========================================================================= */
const books = [];
let busy = false;
let sharedRepoInfo = null;
let skipExisting = false;
let useBatchCommit = true;
let autoConvert = true;
let uploadConcurrency = 6;

function tagClassOf(b){
  return b.state === 'done' ? (b.noChange ? 'tag warn' : 'tag ok')
       : b.state === 'err' ? 'tag err'
       : b.state === 'ready' ? (b.check && b.check.errorCount ? 'tag warn' : 'tag ok')
       : b.state === 'converting' ? 'tag busy' : 'tag';
}

/** 自检面板的展开/收起 */
function bindCheckPanel(i){
  const ckh = $('ckh-' + i);
  if(ckh) ckh.onclick = () => {
    const p = $('ck-' + i);
    const ul = p && p.querySelector('.ck-list');
    if(!ul) return;
    const show = ul.style.display !== 'block';
    ul.style.display = show ? 'block' : 'none';
    const t = p.querySelector('.ck-toggle');
    if(t) t.textContent = show ? '收起' : '展开';
  };
}

/** 释放这本书预览用的 blob URL。
 *  预览图是 `URL.createObjectURL` 造出来的，不 revoke 就一直占着内存：
 *  一本书几百张图，重转换几次、换几本书之后内存只涨不降，
 *  而用户完全看不出发生了什么。导出 HTML 那个是临时链接，单独处理。
 */
function releaseImgUrls(b){
  if(!b || !b._imgUrls) return;
  for(const u of b._imgUrls.values()){
    try{ URL.revokeObjectURL(u); }catch(e){}
  }
  b._imgUrls = null;
}

/** 哪几本书共用了同一个仓库文件夹（键 = 规范化后的文件夹名，值 = 行号数组） */
function dupFolders(){
  const seen = new Map();
  books.forEach((b, i) => {
    const f = safeFolder(b.folder || '');
    if(!f) return;
    if(!seen.has(f)) seen.set(f, []);
    seen.get(f).push(i);
  });
  return seen;
}

/** 重名的文件夹就地标红，并在列表顶上给一句人话提示 */
function refreshFolderWarnings(){
  const seen = dupFolders();
  books.forEach((b, i) => {
    const el = $('folder-' + i);
    if(!el) return;
    const f = safeFolder(b.folder || '');
    const mates = (seen.get(f) || []).filter(k => k !== i);
    if(mates.length){
      el.classList.add('dup');
      el.title = `与《${books[mates[0]].name}》用了同一个文件夹「${f}」，后上传的那本会覆盖先上传的。改一个名字再传。`;
    }else{
      el.classList.remove('dup');
      el.title = '仓库里的文件夹名（改了就是另一本书，不会互相覆盖）';
    }
  });
  const hint = $('dupHint');
  if(hint){
    const dups = [...seen.entries()].filter(([, idx]) => idx.length > 1);
    if(dups.length){
      hint.style.display = 'block';
      hint.innerHTML = '⚠ 有 ' + dups.length + ' 个文件夹重名：' +
        dups.map(([f, idx]) => escapeHtml(f) + '（' + idx.map(k => escapeHtml(books[k].name)).join('、') + '）').join('；') +
        '。同名会互相覆盖，上传前先改掉一个。';
    }else{
      hint.style.display = 'none';
      hint.innerHTML = '';
    }
  }
}

/** 上传前拦一道重名。返回 true 表示"已拦下，别传了" */
function blockIfDupFolder(i){
  const b = books[i];
  if(!b) return false;
  const f = safeFolder(b.folder || '');
  const mates = (dupFolders().get(f) || []).filter(k => k !== i);
  if(!mates.length) return false;
  log(`✗ [${b.name}] 与《${books[mates[0]].name}》用了同一个文件夹「${f}」，` +
      `上传会互相覆盖、README 里最后只剩一本。请把其中一本的文件夹名改掉再传。`, 'err');
  $('logBox').open = true;
  refreshFolderWarnings();
  return true;
}

/** 就地刷新第 i 行：状态徽章 + 自检面板 + 底部汇总。
 *
 *  为什么不能图省事调 render()：render() 会 `list.innerHTML=''` 重建每一行，
 *  用户正在 textarea 里编辑时，那个 textarea 会被销毁再新建 ——
 *  焦点丢失、光标跳到开头、滚动位置归零。打字打到一半被打断，体验极差。
 */
function refreshRow(i){
  const b = books[i];
  const list = $('bookList');
  const row = list && list.children[i];
  if(!b || !row) return;
  const tag = row.querySelector('.row-h > span[class^="tag"]');
  if(tag){
    tag.className = tagClassOf(b);
    tag.textContent = b.stateLabel || (b.state === 'pending' ? '待转换' : '');
  }
  const panel = $('ck-' + i);
  const html = b.check ? checkPanelHtml(i, b) : '';
  if(panel){
    if(html){
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      panel.replaceWith(tmp.firstElementChild);
      bindCheckPanel(i);
    }else{
      panel.remove();
    }
  }else if(html){
    row.insertAdjacentHTML('beforeend', html);
    bindCheckPanel(i);
  }
  updateButtonsAndSummary();
}

/** 底部按钮状态与自检汇总（render() 和 refreshRow() 共用） */
function updateButtonsAndSummary(){
  const readyCount = books.filter(b => b.state === 'ready').length;
  const pendingCount = books.filter(b => b.kind === 'epub' && b.state === 'pending').length;
  $('uploadAll').disabled = busy || !readyCount;
  // 上传过程中不覆盖按钮文字：若无条件重写，「上传中…」会立刻变回「上传全部」，
  // 用户会误以为上传已结束（甚至再点一次开始新一轮）。
  if(!busy){
    $('uploadAll').textContent = readyCount ? `上传全部已就绪（${readyCount}）` : '上传全部已就绪';
    $('convertAll').textContent = pendingCount ? `转换全部待处理（${pendingCount}）` : '转换全部待处理';
    $('convertAll').style.display = pendingCount ? '' : 'none';
  }
  $('convertAll').disabled = busy || !pendingCount;
  const rb = $('rebuildBtn');
  if(rb) rb.disabled = busy || !$('repo').value.trim() || !$('token').value.trim();
  const mb = $('manageBtn');
  if(mb) mb.disabled = busy || !$('repo').value.trim() || !$('token').value.trim();
  $('clearAll').disabled = busy || !books.length;

  const sumEl = $('ckSum');
  const epubs = books.filter(b => b.kind === 'epub' && b.check);
  if(epubs.length){
    const bad = epubs.filter(b => b.check.errorCount > 0);
    const warn = epubs.filter(b => !b.check.errorCount && b.check.warnCount);
    sumEl.style.display = 'flex';
    sumEl.innerHTML = bad.length
      ? `<span class="ck-badge err">${bad.length} 本有错误</span><span class="ck-sum">${escapeHtml(bad.map(b => b.name).join('、'))}</span>`
      : warn.length
        ? `<span class="ck-badge warn">${warn.length} 本有提醒</span><span class="ck-sum">全部无致命错误，可正常上传</span>`
        : `<span class="ck-badge ok">自检通过</span><span class="ck-sum">${epubs.length} 本均无问题</span>`;
  }else{
    sumEl.style.display = 'none';
  }
}

function checkPanelHtml(i, b){
  const c = b.check;
  if(!c) return '';
  const errs = c.issues.filter(x => x.level === 'err');
  const warns = c.issues.filter(x => x.level === 'warn');
  const open = c.errorCount > 0;
  const badge = c.errorCount
    ? `<span class="ck-badge err">${c.errorCount} 个错误</span>`
    : (warns.length ? `<span class="ck-badge warn">${warns.length} 处提醒</span>`
                    : `<span class="ck-badge ok">自检通过</span>`);
  const rows = errs.concat(warns).map(x =>
    `<li class="${x.level}">${x.level === 'err' ? '[错误] ' : '[提醒] '}${escapeHtml(x.msg)}</li>`).join('');
  return `<div class="ck-panel" id="ck-${i}">
      <div class="ck-hd" id="ckh-${i}">
        ${badge}
        <span class="ck-sum">${c.errorCount ? '这些问题会让 GitHub 渲染出错' : (warns.length ? '不影响使用，但值得知道' : '标记成对、表格齐整、图片齐全')}</span>
        ${c.issues.length ? `<span class="ck-toggle">${open ? '收起' : '展开'}</span>` : ''}
      </div>
      ${c.issues.length ? `<ul class="ck-list"${open ? '' : ' style="display:none"'}>${rows}</ul>` : ''}
    </div>`;
}

function render(){
  const list = $('bookList');
  if(!list) return;
  list.innerHTML = '';
  $('emptyHint').style.display = books.length ? 'none' : 'block';

  books.forEach((b, i) => {
    const d = document.createElement('div');
    d.className = 'row';
    const isPdf = b.kind === 'pdf';
    const detail = isPdf
      ? `PDF · ${fmtSize(b.size)} · 原样上传`
      : (b.state === 'ready' || b.state === 'done')
        ? `EPUB · ${fmtSize(b.size)} · ${b.images.length} 图 · ${(b.markdown||'').length} 字符`
          + (b.cover ? '' : ' · 无真封面（自动生成）')   // 上传前就看得见，不必等 README 生成才发现
        : `EPUB · ${fmtSize(b.size)} · 待转换`;
    const tagCls = tagClassOf(b);
    const tagTxt = b.stateLabel || (b.state === 'pending' ? '待转换' : '');

    // 默认收起：进度中的书自动展开，已完成的书收起只显一行摘要
    // 进度中的书自动展开，完成后自动收起（只跟随状态过渡，不覆盖用户手动展开）
    if(b.open == null) b.open = (b.state === 'converting');
    else if(b.state !== 'converting' && b._wasConverting){ b.open = false; }
    b._wasConverting = (b.state === 'converting');
    d.className = 'row' + (b.open ? ' open' : '');

    const isDone = b.state === 'ready' || b.state === 'done';
    const quick = isDone
      ? `<button class="sm" id="up-${i}">上传</button>`
      : `<button class="sm" id="cv-${i}">转换</button>`;

    d.innerHTML = `
      <div class="row-h">
        <span class="caret">▸</span>
        <div class="ftype ${isPdf ? 'pdf' : 'epub'}">${isPdf ? 'PDF' : 'EPUB'}</div>
        <div class="fname"><b title="${escapeHtml(b.name)}">${escapeHtml(b.name)}</b><span>${escapeHtml(detail)}</span></div>
        <span class="${tagCls}">${escapeHtml(tagTxt)}</span>
        <span class="quick">${quick}</span>
      </div>
      ${isDone ? `<div class="row-b">
        <input type="text" id="folder-${i}" value="${escapeHtml(b.folder)}" placeholder="仓库内文件夹名" />
        <button class="sm" id="cv-${i}">重新转换</button>
        <button class="sm" id="pvbtn-${i}">预览</button>
        ${isPdf ? '' : `<button class="sm" id="exp-${i}" title="存成一份图片全内嵌的 HTML，用浏览器打开就是全书效果">存成 HTML</button>`}
        <button class="sm" id="up2-${i}">上传此文件</button>
        <button class="sm" id="rm-${i}">移除</button>
        <textarea id="md-${i}" rows="4" placeholder="可直接编辑 Markdown"></textarea>
        <div class="pv" id="pv-${i}" style="display:none"></div>
      </div>` : `<div class="row-b">
        <button class="sm" id="cv2-${i}">转换为 Markdown</button>
        <button class="sm" id="rm-${i}">移除</button>
      </div>`}
      ${b.check ? checkPanelHtml(i, b) : ''}
    `;
    list.appendChild(d);

    // 性能关键：**收起的行不要把 markdown 塞进 textarea**。
    // 一本书的正文可达数百 KB～数 MB，10 本书每次 render 就要往 DOM 里灌十几 MB 文本，
    // 实测单次 render 800ms+、批量上传期间累计近 20 秒 —— 而图片上传完全不碰 DOM，
    // 所以用户感觉"图片很快、markdown 很慢"。展开时再按需填入即可。
    const ta = $('md-' + i);
    if(ta && b.open) ta.value = b.markdown || '';
  });

  books.forEach((b, i) => {
    // 点击整行切换展开/收起（点按钮时不触发）
    const rowEl = list.children[i];
    const head = rowEl && rowEl.querySelector('.row-h');
    if(head) head.onclick = e => {
      if(e.target.closest('button') || e.target.closest('input')) return;
      b.open = !b.open;
      render();
      // 展开时才把正文灌进 textarea（收起的行保持空，省下大量 DOM 开销）
      if(b.open){
        const ta = $('md-' + i);
        if(ta && !ta.value && b.markdown) ta.value = b.markdown;
      }
    };
    // 快捷按钮（收起时可用）与展开后的按钮同一个动作
    const bind = (id, fn) => { const el = $(id); if(el) el.onclick = e => { e.stopPropagation(); fn(); }; };
    bind('cv-' + i, () => convertBook(i));
    bind('cv2-' + i, () => convertBook(i));
    bind('up-' + i, () => doUpload(i));
    bind('up2-' + i, () => doUpload(i));
    bind('rm-' + i, () => { releaseImgUrls(b); books.splice(i, 1); render(); });
    /* 文件夹名是手填的，改完立刻查重名 —— 撞车会静默覆盖，必须当场看见 */
    const fi = $('folder-' + i);
    if(fi) fi.addEventListener('input', () => { b.folder = fi.value; refreshFolderWarnings(); saveDrafts(); });
    const expBtn = $('exp-' + i);
    if(expBtn) expBtn.onclick = () => {
      const ta = $('md-' + i);
      const snap = Object.assign({}, b, { markdown: (ta && ta.value) || b.markdown || '' });
      const html = exportPreviewHtml(snap);
      const base = String((b.meta && b.meta.title) || b.folder || b.name || 'preview')
        .replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);
      const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = base + '.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 8000);
      log(`  [预览] 已存出 ${base}.html（${Math.round(html.length / 1024)} KB，${(b.images || []).length} 张图已内嵌）`, 'ok');
    };
    const pvbtn = $('pvbtn-' + i);
    /* 把这本书的内存图片挂成 blob URL，预览里才能看到真图 */
    const imgUrls = () => {
      if(!b._imgUrls){
        b._imgUrls = new Map();
        for(const [name, bytes] of (b.images || [])){
          try{ b._imgUrls.set('images/' + name, URL.createObjectURL(new Blob([bytes]))); }catch(e){}
        }
      }
      return b._imgUrls;
    };
    if(pvbtn) pvbtn.onclick = () => {
      const el = $('pv-' + i);
      if(!el) return;
      const show = el.style.display !== 'block';
      el.style.display = show ? 'block' : 'none';
      if(show && !el.dataset.filled){ el.innerHTML = renderMdPreview($('md-' + i).value || b.markdown || '', imgUrls()); el.dataset.filled = '1'; }
      pvbtn.textContent = show ? '收起预览' : '预览';
    };
    const md = $('md-' + i);
    if(md) md.addEventListener('input', () => {
      b.markdown = md.value;
      saveDrafts();      // 正文是最不能丢的东西，改一个字就安排一次保存
      /* base64 别在这里算：一本 1MB 的书每敲一个键就要重新编码整篇正文（实测 15ms），
         而它只在真正上传那一刻才用得上。改成"标记为失效，上传时再算"。 */
      b.base64 = null;
      const pv = $('pv-' + i);
      if(pv && pv.style.display === 'block') pv.dataset.pending = '1';
      clearTimeout(b._ckTimer);
      b._ckTimer = setTimeout(() => {
        b.check = validateMarkdown(b.markdown, imageNameSet(b.images));
        /* 自检结果变了只刷这一行，绝不能 render() 整表 ——
           render() 会重建整个列表，正在打字的 textarea 被销毁重建，光标直接跳走。 */
        refreshRow(i);
        if(pv && pv.style.display === 'block' && pv.dataset.pending){
          pv.innerHTML = renderMdPreview(md.value, imgUrls());
          pv.dataset.pending = ''; pv.dataset.filled = '1';
        }
      }, 400);
    });
    bindCheckPanel(i);
  });

  updateButtonsAndSummary();
  refreshFolderWarnings();
  saveDrafts();          // 任何状态变化都记一笔（防抖，打字时不会每个键都写）
}

/** 轻量 Markdown → HTML（仅用于本地预览）
 *
 *  urlMap：md 里的图片路径 → 本地可直接显示的地址。
 *  没有它，预览里的 <img src="images/xxx.jpg"> 会去页面所在目录找文件 ——
 *  那儿压根没有这些图，于是整本书的配图全裂。这是"想先看看效果"看不成的根本原因。
 */
function renderMdPreview(md, urlMap){
  if(!md || !md.trim()) return '<span style="color:#8b949e">（无内容）</span>';
  const safeUrl = u => {
    const t = String(u).trim().replace(/[\u0000-]/g, '');
    if(/^(https?:|mailto:|tel:)/i.test(t)) return t;
    if(/^[#/]/.test(t) || !/^[a-z][a-z0-9+.-]*:/i.test(t)) return t;
    return '#';
  };
  /* 预览要和 GitHub 一样严格：`**绝对优 **`、`** 绝对优**` 这类内侧贴空格的写法
     CommonMark 认作"没闭合"，星号会原样印出来。预览如果照正则无脑加粗，
     就会出现「本地是粗体、上传后是星号」的分裂 —— 用户没法在本地自查。 */
  const tight = s => !/^\s|\s$/.test(s);
  const inline = s => escapeHtml(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*\*([^*]+)\*\*\*/g, (m, c) => tight(c) ? `<strong><em>${c}</em></strong>` : m)
    .replace(/\*\*([^*]+)\*\*/g, (m, c) => tight(c) ? `<strong>${c}</strong>` : m)
    .replace(/(^|[^*])\*([^*]+)\*/g, (m, p, c) => tight(c) ? p + `<em>${c}</em>` : m)
    .replace(/~~([^~]+)~~/g, (m, c) => tight(c) ? `<del>${c}</del>` : m)
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m,a,u)=>{
      let src = safeUrl(u);
      if(urlMap){
        let key = u;
        try{ key = decodeURIComponent(u); }catch(e){}
        const hit = urlMap.get(key) || urlMap.get(u);
        if(hit) src = hit;
      }
      return `<img src="${src}" alt="${a}" style="max-width:100%">`;
    })
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m,t,u)=>`<a href="${safeUrl(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`);
  const out = [];
  const lines = String(md).split('\n');
  let inCode = false, codeBuf = [], inList = false, inQuote = false, inTable = false;
  const closeList = () => { if(inList){ out.push('</ul>'); inList = false; } };
  const closeQuote = () => { if(inQuote){ out.push('</blockquote>'); inQuote = false; } };
  const closeTable = () => { if(inTable){ out.push('</tbody></table>'); inTable = false; } };
  const closeAll = () => { closeList(); closeQuote(); closeTable(); };
  for(let i = 0; i < lines.length; i++){
    let l = lines[i];
    if(/^\s*```/.test(l)){
      if(inCode){ out.push('<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>'); codeBuf = []; inCode = false; }
      else { closeAll(); inCode = true; }
      continue;
    }
    if(inCode){ codeBuf.push(l); continue; }
    if(/^\s*\|/.test(l)){
      const cells = l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g,'|'));
      if(/^[\s:|-]+$/.test(l)){
        if(!inTable){ continue; }
        out.push(cells.map(() => '<th style="text-align:left">' + inline('') + '</th>').join('').replace(/<th[^>]*><\/th>/g,'<th></th>'));
        continue;
      }
      if(!inTable){ closeAll(); out.push('<table><thead><tr>'); inTable = true; }
      else if(out[out.length-1] && out[out.length-1].includes('</thead>')){}
      if(inTable && out[out.length-1] === '' || (out.length && out[out.length-1].startsWith('<thead'))){
        // 已在 thead 里
      }
      if(inTable && !out.some(x => x === '</thead>')){
        out.push('<tr>' + cells.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>');
      }else{
        out.push('<tr>' + cells.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>');
      }
      continue;
    }
    closeTable();
    if(!l.trim()){ closeAll(); continue; }
    let m;
    if(m = l.match(/^(#{1,6})\s+(.+)$/)){ closeAll(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); continue; }
    if(m = l.match(/^\s*[-*]\s+(.+)$/)){
      closeQuote();
      if(!inList){ closeTable(); out.push('<ul>'); inList = true; }
      out.push('<li>' + inline(m[1]) + '</li>');
      continue;
    }
    if(m = l.match(/^\s*(\d+)\.\s+(.+)$/)){
      closeQuote();
      if(!inList){ closeTable(); out.push('<ol>'); inList = true; }
      out.push('<li>' + inline(m[2]) + '</li>');
      continue;
    }
    if(m = l.match(/^\s*>\s?(.*)$/)){
      closeList(); closeTable();
      if(!inQuote){ out.push('<blockquote>'); inQuote = true; }
      out.push('<p>' + inline(m[1]) + '</p>');
      continue;
    }
    if(/^\s*---+/.test(l)){ closeAll(); out.push('<hr>'); continue; }
    closeAll();
    out.push('<p>' + inline(l) + '</p>');
  }
  if(inCode && codeBuf.length) out.push('<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>');
  closeAll();
  if(inTable) out.push('</tbody></table>');
  return out.join('\n');
}

/* =========================================================================
   12. 转换与上传流程
   ========================================================================= */
function addFiles(files){
  let added = 0;
  for(const f of files){
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if(!['pdf','epub'].includes(ext)){ log(`已忽略不支持的文件：${f.name}`, 'warn'); continue; }
    const isPdf = ext === 'pdf';
    books.push({
      id: newBookId(),
      file: f, name: f.name, size: f.size,
      kind: isPdf ? 'pdf' : 'epub',
      folder: safeFolder(f.name.replace(/\.[^.]+$/,'')),
      state: isPdf ? 'loading' : 'pending',
      stateLabel: isPdf ? '读取中' : '待转换',
      markdown: '', images: [], base64: null, origB64: null, edited: false,
      keepOrig: $('keepOrigAll') ? $('keepOrigAll').checked : false,
      skipExisting, check: null,
      _binDirty: true          // 原文件和配图都是新的，要写进草稿
    });
    added++;
    if(isPdf){
      const b = books[books.length-1];
      const fr = new FileReader();
      fr.onload = () => { b.base64 = String(fr.result).split(',')[1] || ''; b.state = 'ready'; b.stateLabel = '已就绪'; render(); };
      fr.onerror = () => { b.state='err'; b.stateLabel='读取失败'; render(); };
      fr.readAsDataURL(f);
    }
  }
  if(added) log(`已加入 ${added} 个文件`, 'info');
  render();
  if(added) saveDrafts();
  if(autoConvert && added && books.some(b => b.kind === 'epub' && b.state === 'pending')){
    setTimeout(() => convertAll(), 60);
  }
}

async function convertBook(i){
  const b = books[i];
  b.state = 'converting'; b.stateLabel = '转换中';
  render();
  if(!b.inBatch) progStart(`转换中：${escapeHtml(b.name)}`, 0, 100);
  try{
    const buf = await b.file.arrayBuffer();
    const r = await epubToMarkdown(buf);
    releaseImgUrls(b);            // 旧图换掉了，旧预览链接必须释放，否则内存只涨不降
    b.markdown = r.markdown;
    b.images = r.images;
    b.cover = r.cover || null;
    b.meta = r.meta || {};
    b.base64 = bytesToBase64(enc.encode(r.markdown));
    b.edited = false;
    /* 原件 base64 只在"保留 EPUB 原件"时才用得上，以前却无条件就算：
       实测 20MB → 157ms、常驻 53MB（base64 在 JS 里按 UTF-16 存，约为原体积的 2.6 倍），
       90MB 的书就是约 700ms + 约 240MB 内存 —— 而默认根本不会上传它。
       改成"真要上传时才算"，同时不再多复制一份 Uint8Array。 */
    b.origB64 = null;
    b.state = 'ready';
    b.stateLabel = '已就绪';
    b._binDirty = true;                 // 配图换了一整套，草稿里的二进制要重写
    b.check = validateMarkdown(r.markdown, imageNameSet(r.images));
    if(b.check.errorCount){
      b.stateLabel = '有错误';
      log(`✗ [${b.name}] 自检发现 ${b.check.errorCount} 个错误：`, 'err');
      b.check.issues.filter(x => x.level === 'err').forEach(x => log(`    ${x.msg}`, 'err'));
      $('logBox').open = true;
    }else if(b.check.warnCount){
      log(`✔ [${b.name}] 转换完成：${r.markdown.length} 字符，${r.images.length} 张图`, 'ok');
      log(`⚠ [${b.name}] 自检通过，有 ${b.check.warnCount} 处提醒`, 'warn');
    }else{
      log(`✔ [${b.name}] 转换完成：${r.markdown.length} 字符，${r.images.length} 张图，自检全部通过`, 'ok');
    }
    if(!b.inBatch) progEnd(`转换完成：${r.markdown.length} 字符 · ${r.images.length} 张图`, b.check.errorCount === 0);
  }catch(e){
    b.state = 'err'; b.stateLabel = '转换失败';
    log(`✗ [${b.name}] 转换失败：${e.message}`, 'err');
    $('logBox').open = true;
    if(!b.inBatch) progEnd('转换失败：' + (e.friendly || e.message), false);
  }
  render();
}

async function convertAll(){
  if(busy){ log('已有任务在进行中，请稍候', 'warn'); return; }
  const queue = books.map((b, i) => ({ b, i })).filter(({ b }) => b.kind === 'epub' && b.state === 'pending');
  const total = queue.length;
  if(!total){ log('没有待转换的书（PDF 无需转换）', 'warn'); return; }

  busy = true;
  const btn = $('convertAll');
  const oldText = btn.textContent;
  btn.disabled = true; btn.textContent = '转换中…';
  progStart('准备转换…', 0, 100);
  let ok = 0, fail = 0, warn = 0;
  try{
    for(let k = 0; k < queue.length; k++){
      const { b, i } = queue[k];
      progState.base = (k / total) * 100;
      progState.span = 100 / total;
      progState.text = `转换中 <b>${k + 1}</b> / ${total}（${escapeHtml(b.name)}）`;
      progSet(0, progState.text);
      b.inBatch = true;
      try{
        await convertBook(i);
        if(b.state === 'err') fail++;
        else if(b.check && b.check.errorCount){ ok++; warn++; }
        else ok++;
      }catch(e){ fail++; }
      finally{ b.inBatch = false; }
      render();
    }
    const msg = fail ? `转换完成：成功 ${ok} 本，失败 ${fail} 本`
      : (warn ? `转换完成：${ok} 本（其中 ${warn} 本自检有错误）`
              : `全部转换完成：${ok} 本`);
    progEnd(msg, fail === 0);
    if(warn) $('logBox').open = true;
  }catch(e){
    progEnd('转换中断：' + (e.friendly || e.message), false);
  }finally{
    busy = false;
    btn.disabled = false; btn.textContent = oldText;
    render();
  }
}

async function doUpload(i){
  const b = books[i];
  if(b.uploading) return;
  if(busy && !b.inBatch){ log(`⚠ 已有上传任务在进行中，「${b.name}」已排队等待`, 'warn'); return; }
  /* 两本书撞同一个文件夹名：后传的会静默覆盖先传的，README 里最后只剩一本。
     这种丢书没有报错、没有提示，只能靠人盯着发现 —— 所以直接拦下来。 */
  if(blockIfDupFolder(i)) return;
  if(b.kind === 'epub'){
    b.check = validateMarkdown(b.markdown || '', imageNameSet(b.images));
    if(b.check.errorCount){
      render();
      log(`✗ [${b.name}] 自检发现 ${b.check.errorCount} 个错误，已阻止上传：`, 'err');
      b.check.issues.filter(x => x.level === 'err').forEach(x => log(`    ${x.msg}`, 'err'));
      $('logBox').open = true;
      return;
    }
  }
  b.uploading = true;
  b.stateLabel = '上传中';
  render();
  if(!b.inBatch) progStart(`上传中：${escapeHtml(b.name)}`, 0, 100);

  const fi = $('folder-' + i); if(fi) b.folder = fi.value;
  const ta = $('md-' + i);
  // 只有 textarea 里确实有内容才采纳它。
  // 收起的行 textarea 是空的（为省 DOM 开销没灌正文），绝不能拿空值覆盖 b.markdown。
  if(ta && ta.value){
    if(ta.value !== b.markdown){ b.markdown = ta.value; b.edited = true; }
    b.base64 = bytesToBase64(enc.encode(b.markdown));
  }else if(!b.base64 && b.kind === 'epub'){
    // 兜底：内存里还有正文就重新编码
    b.base64 = bytesToBase64(enc.encode(b.markdown || ''));
  }

  try{
    const r = await uploadBook(b);
    b.lastResult = r;
    /* 0 个文件提交 ≠ 成功上传。以前两种都写"已上传"，
       用户去 GitHub 一看没变化，只能怀疑是工具坏了 —— 其实常常是"内容确实没变，不需要提交"。 */
    if(r.failed > 0 && r.uploaded === 0){ b.state = 'err'; b.stateLabel = '上传失败'; }
    else if(r.failed > 0){ b.state = 'done'; b.stateLabel = '部分成功（' + r.failed + ' 个没传上）'; }
    else if(r.uploaded === 0 && r.held > 0){ b.state = 'done'; b.noChange = true; b.stateLabel = '被设置挡住'; }
    else if(r.uploaded === 0){ b.state = 'done'; b.noChange = true; b.stateLabel = '无变化（已是最新）'; }
    else { b.state = 'done'; b.noChange = false; b.stateLabel = '已上传'; }
  }catch(e){
    b.state = 'err'; b.stateLabel = '上传失败';
    log(`✗ [${b.name}] 上传失败：${e.friendly || e.message}`, 'err');
    $('logBox').open = true;
  }
  /* 有文件没传上时必须把日志摊开 —— 否则界面只剩一句"部分成功"，
     用户既不知道是哪几个文件、也不知道为什么，等于没说。 */
  if(b.lastResult && b.lastResult.failed > 0){
    log(`  ⚠ [${b.name}] 有 ${b.lastResult.failed} 个文件没进仓库，往上翻找 [失败] 开头的行`, 'warn');
    $('logBox').open = true;
  }
  b.uploading = false;
  if(!b.inBatch){
    if(b.noChange){
      progEnd(`没有提交任何文件：${escapeHtml(b.name)}（${escapeHtml(b.stateLabel)}）`, false);
    }else{
      const okAll = b.state === 'done' && b.stateLabel === '已上传';
      progEnd(okAll ? `已上传：${escapeHtml(b.name)}` : `上传完成但有问题：${escapeHtml(b.stateLabel)}`, okAll);
    }
  }
  render();
}

/**
 * 给仓库里没有封面的书补一张文字封面。
 *
 * 已经传过的 PDF / .md 书，仓库里只有 xxx.pdf / xxx.md，没有 cover.*，
 * 首页那一格就只能写「无封面」。这里一次性补齐，省得一本本重传。
 * 用一次 commit 提交所有生成的封面。
 */
async function fillMissingCovers(token, info){
  const files = await listAllFiles(token, info);
  const dirs = new Map();
  for(const f of files){
    const i = f.path.indexOf('/');
    if(i < 0) continue;
    const dir = f.path.slice(0, i);
    if(dir === 'images' || dir === '.github') continue;
    const rest = f.path.slice(i + 1);
    if(!dirs.has(dir)) dirs.set(dir, { cover: false, kind: 'md' });
    const rec = dirs.get(dir);
    const bn = baseName(f.path);
    if(/^cover\.(jpe?g|png|webp|gif|svg)$/i.test(bn) && !rest.includes('/')) rec.cover = true;
    else if(/\.pdf$/i.test(bn) && bn === dir + '.pdf') rec.kind = 'pdf';
    else if(/\.epub$/i.test(bn) && bn === dir + '.epub') rec.kind = 'epub';
  }

  // 书名优先取索引里的真名，没有就用目录名
  let libIndex = {};
  try{
    const idxFile = files.find(x => x.path === 'books.json');
    const txt = await readRepoText(token, info, 'books.json', idxFile ? idxFile.sha : '');
    if(txt) libIndex = JSON.parse(txt) || {};
  }catch(e){}

  const todo = [];
  for(const [dir, rec] of dirs){
    if(rec.cover) continue;
    const title = String((libIndex[dir] || {}).title || '').trim() || dir;
    todo.push({ dir, kind: rec.kind, bytes: enc.encode(makeTextCover(title, rec.kind)) });
  }
  if(!todo.length) return 0;

  const base = `https://api.github.com/repos/${info.full}/git`;
  await serialize(() => withRetry(async () => {
    const parentSha = await readHeadRef(token, base, info);
    const tree = [];
    for(const t of todo){
      const blob = await gh(token, base + '/blobs', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: bytesToBase64(t.bytes), encoding: 'base64' })
      });
      tree.push({ path: `${t.dir}/cover.svg`, mode: '100644', type: 'blob', sha: blob.sha });
    }
    const tr = await gh(token, base + '/trees', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base_tree: parentSha, tree })
    });
    const commit = await gh(token, base + '/commits', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `add text covers for ${todo.length} book(s)`, tree: tr.sha, parents: [parentSha] })
    });
    await gh(token, `${base}/refs/heads/${encodeURIComponent(info.default_branch)}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sha: commit.sha, force: false })
    });
  }, { tries: 4, label: '补封面' }));

  return todo.length;
}

/* =========================================================================
   10.5 仓库里已有的书：改名 / 删除
   =========================================================================
   以前这个工具只会往仓库里"加"，传错了想撤掉只能上 GitHub 网页一页页删，
   或者本地改个文件夹名重传一本（旧的还留在仓库里占位）。
   删除和改名都只动 tree，不动 blob 内容：
     · 删除 = 那几个 path 在 tree 里把 sha 写成 null
     · 改名 = 把同一批 blob 的 sha 挂到新 path 上，再把旧 path 删掉
   所以整本书的改名是一个 commit、零字节上传 —— 300 张图的书也不需要重传。 */

/** 顶层目录 = 一本书。"images"、".github" 是公共目录，不算书。 */
function groupRepoBooks(files){
  const map = new Map();
  for(const f of files){
    const i = f.path.indexOf('/');
    if(i < 0) continue;
    const dir = f.path.slice(0, i);
    if(dir === 'images' || dir === '.github') continue;
    if(!map.has(dir)) map.set(dir, { dir, files: [], kb: 0, md: false, pdf: false, epub: false, cover: null, images: 0 });
    const rec = map.get(dir);
    rec.files.push(f);
    rec.kb += f.size || 0;
    const rest = f.path.slice(i + 1), bn = baseName(f.path);
    if(/\.md$/i.test(bn) && bn === dir + '.md') rec.md = true;
    else if(/\.pdf$/i.test(bn) && bn === dir + '.pdf') rec.pdf = true;
    else if(/\.epub$/i.test(bn) && bn === dir + '.epub') rec.epub = true;
    else if(/^cover\.(jpe?g|png|webp|gif|svg)$/i.test(bn) && !rest.includes('/')) rec.cover = bn;
    else if(rest.startsWith('images/')) rec.images++;
  }
  return [...map.values()].sort((a, b) => a.dir.localeCompare(b.dir, 'zh'));
}

async function readBooksJson(token, info, files){
  const hit = (files || []).find(x => x.path === 'books.json');
  let idx = {};
  try{
    const txt = await readRepoText(token, info, 'books.json', hit ? hit.sha : '');
    if(txt) idx = JSON.parse(txt) || {};
  }catch(e){ /* 没有索引或不是合法 JSON：按"没有"处理 */ }
  return idx;
}

/**
 * 改名的路径映射：old/old.md → new/new.md。
 * 主文件（.md / .epub / .pdf 那个同名文件）跟着书名走，
 * 其余（cover.*、images/...）保持原样搬过去。
 */
function renamedPath(path, oldDir, newDir){
  const seg = path.slice(oldDir.length + 1).split('/');
  const bn = seg[seg.length - 1];
  const m = /^(.*?)(\.[^.]+)$/.exec(bn);
  if(m && (m[1] === oldDir || m[1] === safeFolder(oldDir))) seg[seg.length - 1] = newDir + m[2];
  return newDir + '/' + seg.join('/');
}

function booksJsonEntries(idx){
  const bytes = enc.encode(JSON.stringify(idx, null, 2) + '\n');
  return [{ path: 'books.json', b64: bytesToBase64(bytes) }];
}

/** 删掉仓库里的一整本书（含 books.json 里的条目），然后重建首页 */
async function deleteRepoBook(token, info, dir){
  const files = await listAllFiles(token, info);
  const mine = files.filter(f => f.path === dir || f.path.startsWith(dir + '/'));
  if(!mine.length) throw new Error(`仓库里没有「${dir}」这本书（也可能已经删过了）`);
  const idx = await readBooksJson(token, info, files);
  const adds = [];
  if(idx[dir]){
    const next = {};
    for(const k of Object.keys(idx)) if(k !== dir) next[k] = idx[k];
    adds.push(...booksJsonEntries(next));
  }
  const r = await commitFilesBatch(token, info, adds, `remove ${dir}（${mine.length} 个文件）`,
                                  { dels: mine.map(f => f.path) });
  return { files: mine.length, idx: adds.length ? 1 : 0, commit: r };
}

/** 给仓库里的一本书改文件夹名；blob 复用，一个字节都不用重传 */
async function renameRepoBook(token, info, oldDir, newDirRaw){
  const newDir = safeFolder(newDirRaw);
  if(!newDir || newDir === 'book') throw new Error('新名字不能用（只能是中英文、数字、- _ . 的组合）');
  if(newDir === oldDir) throw new Error('新名字和现在的一样');
  const files = await listAllFiles(token, info);
  const mine = files.filter(f => f.path === oldDir || f.path.startsWith(oldDir + '/'));
  if(!mine.length) throw new Error(`仓库里没有「${oldDir}」这本书`);
  if(files.some(f => f.path === newDir || f.path.startsWith(newDir + '/')))
    throw new Error(`仓库里已经有「${newDir}」了，换一个名字`);

  const refs = mine.map(f => ({ path: renamedPath(f.path, oldDir, newDir), sha: f.sha }));
  const dels = mine.map(f => f.path);
  const idx = await readBooksJson(token, info, files);
  const adds = [];
  if(idx[oldDir]){
    const next = {};
    for(const k of Object.keys(idx)) next[k === oldDir ? newDir : k] = idx[k];
    const rec = Object.assign({}, idx[oldDir]);
    if(!rec.title || rec.title === oldDir) rec.title = newDir;
    next[newDir] = rec;
    adds.push(...booksJsonEntries(next));
  }
  const r = await commitFilesBatch(token, info, adds, `rename ${oldDir} → ${newDir}`,
                                  { refs, dels });
  return { files: mine.length, idx: adds.length ? 1 : 0, commit: r };
}

/** 操作完顺手重建首页，否则 README 里还挂着已经删掉/改名的书 */
async function refreshReadmeAfter(token, info, what){
  try{
    const r = await updateReadme(token, info);
    log(`  [更新] README.md：${r.entries} 个条目，commit ${String(r.commit).slice(0, 7)}`, 'ok');
  }catch(e){
    log(`  [提示] ${what} 成功，但 README 重建失败（不影响仓库内容）：${e.friendly || e.message}`, 'warn');
  }
}

/* ---------- 面板 ---------- */
let repoBooks = [];

async function loadRepoBooks(){
  const token = $('token').value.trim(), repo = $('repo').value.trim();
  const tip = $('rpTip'), list = $('rpList');
  $('repoPanel').style.display = '';
  if(!token || !repo){ tip.textContent = '先填 Token 和仓库名'; list.innerHTML = ''; return; }
  tip.textContent = '读取中…';
  list.innerHTML = '<div class="rp-tip">正在读取仓库文件列表…</div>';
  try{
    const info = await repoInfo(token, repo);
    sharedRepoInfo = Object.assign(info, { key: repo.trim() });
    $('repoDot').classList.add('on');
    const files = await listAllFiles(token, info);
    repoBooks = groupRepoBooks(files);
    tip.textContent = `${repoBooks.length} 本 · 共 ${files.length} 个文件`;
    renderRepoBooks();
  }catch(e){
    tip.textContent = '读取失败';
    list.innerHTML = `<div class="rp-tip">读取失败：${escapeHtml(e.friendly || e.message)}</div>`;
    log(`✗ 读取仓库书籍失败：${e.friendly || e.message}`, 'err');
  }
}

function renderRepoBooks(){
  const list = $('rpList');
  if(!repoBooks.length){
    list.innerHTML = '<div class="rp-tip">仓库里还没有书。上传一本之后这里就能改名、删除。</div>';
    return;
  }
  list.innerHTML = repoBooks.map((bk, i) => {
    const bits = [];
    if(bk.md) bits.push('Markdown');
    if(bk.pdf) bits.push('PDF');
    if(bk.epub) bits.push('EPUB 原件');
    if(bk.images) bits.push(`${bk.images} 图`);
    if(bk.cover) bits.push('有封面');
    return `<div class="rp-row" id="rpb-${i}">
      <span class="rp-name" title="${escapeHtml(bk.dir)}">${escapeHtml(bk.dir)}</span>
      <span class="rp-meta">${bits.join(' · ')}${bk.kb ? ' · ' + fmtSize(bk.kb * 1) : ''} · ${bk.files.length} 个文件</span>
      <input type="text" id="rpn-${i}" value="${escapeHtml(bk.dir)}" placeholder="新的文件夹名" />
      <button class="sm" id="rpok-${i}">改名</button>
      <button class="sm danger" id="rpd-${i}">删除</button>
    </div>`;
  }).join('');
  repoBooks.forEach((bk, i) => {
    $('rpok-' + i).onclick = () => repoRename(i);
    $('rpd-' + i).onclick = () => repoDelete(i);
  });
}

async function repoRename(i){
  const bk = repoBooks[i];
  const el = $('rpn-' + i);
  const to = safeFolder(el ? el.value : '');
  if(busy) return;
  if(to === bk.dir){ log('新名字和现在的一样，没有改动', 'warn'); return; }
  const token = $('token').value.trim(), repo = $('repo').value.trim();
  if(!token || !repo) return alert('请先填写 Token 和仓库名');
  busy = true; render();
  progStart(`改名：${bk.dir} → ${to}`, 0, 100);
  try{
    const info = await repoInfo(token, repo);
    const r = await renameRepoBook(token, info, bk.dir, to);
    progEnd(`已改名：${bk.dir} → ${to}（${r.files} 个文件，0 字节重传）`, true);
    log(`✔ 已把「${bk.dir}」改名为「${to}」：${r.files} 个文件，blob 直接复用，没有重传任何内容`, 'ok');
    await refreshReadmeAfter(token, info, '改名');
    bk.dir = to;
    el.value = to;
    await loadRepoBooks();
  }catch(e){
    progEnd('改名失败：' + (e.friendly || e.message), false);
    log(`✗ 改名失败：${e.friendly || e.message}`, 'err');
    $('logBox').open = true;
  }finally{
    busy = false; render();
  }
}

async function repoDelete(i){
  const bk = repoBooks[i];
  if(busy) return;
  if(!confirm(`确定从仓库里删除「${bk.dir}」吗？\n\n${bk.files.length} 个文件会被删掉（含配图和封面），GitHub 上就找不回来了。\n只删仓库里的文件，不动你电脑上的原件。`)) return;
  const token = $('token').value.trim(), repo = $('repo').value.trim();
  if(!token || !repo) return alert('请先填写 Token 和仓库名');
  busy = true; render();
  progStart(`删除：${bk.dir}`, 0, 100);
  try{
    const info = await repoInfo(token, repo);
    const r = await deleteRepoBook(token, info, bk.dir);
    progEnd(`已删除：${bk.dir}（${r.files} 个文件）`, true);
    log(`✔ 已从仓库删除「${bk.dir}」：${r.files} 个文件${r.idx ? '，books.json 里那条也去掉了' : ''}`, 'ok');
    await refreshReadmeAfter(token, info, '删除');
    await loadRepoBooks();
  }catch(e){
    progEnd('删除失败：' + (e.friendly || e.message), false);
    log(`✗ 删除失败：${e.friendly || e.message}`, 'err');
    $('logBox').open = true;
  }finally{
    busy = false; render();
  }
}

/**
 * 书籍目录页：写进 `<书名>/README.md`。
 *
 * 为什么值得多这一个文件：在 GitHub 上点进 `书名/` 这个目录，看到的是一份
 * 文件列表 —— 封面缩略图、元信息、下载入口全都没有，只有一堆文件名。
 * 有了这份 README，GitHub 会自动把它渲染在目录列表下面，
 * 于是每本书的目录页就是一张封面 + 书名作者 + 下载链接，像个正经书架。
 * 顶部还留了回首页的入口，不用一路点浏览器后退。
 */
function bookPageMd(b, folder, coverName, today){
  const meta = b.meta || {};
  const title = String(meta.title || folder).trim() || folder;
  const L = ['<div align="center">', '', '# ' + title, ''];
  if(coverName) L.push('<img src="' + coverName + '" width="180" alt="' +
                   title.replace(/[\[\]|"]/g, ' ').trim() + '">', '');
  const sub = [];
  if(meta.creator) sub.push(meta.creator);
  if(meta.publisher) sub.push(meta.publisher);
  if(sub.length) L.push('<sub>' + sub.join(' · ') + '</sub>', '');
  L.push('</div>', '', '---', '');

  const bits = [];
  if((b.markdown || '').length) bits.push('正文约 ' + fmtChars((b.markdown || '').length));
  if((b.images || []).length) bits.push((b.images || []).length + ' 张配图');
  if(meta.language) bits.push('语言 ' + meta.language);
  if(today) bits.push('上传于 ' + today);
  if(bits.length) L.push(bits.join(' · '), '');

  L.push('## 阅读与下载', '');
  if(b.kind === 'pdf'){
    L.push('- [查看 PDF](' + folder + '.pdf)');
  }else{
    L.push('- [在线阅读](' + folder + '.md)');
    if(b.keepOrig) L.push('- [下载 EPUB 原件](' + folder + '.epub)');
  }
  L.push('', '---', '', '[← 返回书库首页](../README.md)');
  return L.join('\n') + '\n';
}

/**
 * 只重建首页，不碰书。
 * 用来单独验证"仓库里到底有什么、封面认出几个"——否则每次都得重传一本书才触发重建。
 * 顺手给没有封面的书补文字封面（只新增 cover.svg，不动任何书籍文件）。
 */
async function rebuildReadme(){
  if(busy) return;
  const token = $('token').value.trim(), repo = $('repo').value.trim();
  if(!token || !repo) return log('先填 GitHub Token 和仓库名', 'warn');
  busy = true; render();
  progStart('重建首页…', 0, 100);
  try{
    const info = await repoInfo(token, repo);
    sharedRepoInfo = Object.assign(info, { key: repo.trim() });
    $('repoDot').classList.add('on');
    let filled = 0;
    try{
      filled = await fillMissingCovers(token, info);
      if(filled) log(`  ✔ 为 ${filled} 本没有封面的书生成了文字封面`, 'ok');
    }catch(e){
      log(`  [提示] 补封面失败（不影响首页）：${e.friendly || e.message}`, 'warn');
    }
    const r = await updateReadme(token, info);
    progEnd('首页已重建');
    log(`✔ 首页已重建：${r.entries} 个条目 · ${fmtSize(r.bytes)} · commit ${String(r.commit).slice(0, 7)}`, 'ok');
    log(`  https://github.com/${info.full}/commit/${r.commit}`, 'info');
    log('  刷新仓库首页就能看到新的「最近更新」时间', 'info');
  }catch(e){
    progEnd('重建失败', false);
    log(`✗ 重建首页失败：${e.friendly || e.message}`, 'err');
    $('logBox').open = true;
  }finally{
    busy = false; render();
  }
}

async function uploadAll(){
  if(busy){ log('已有任务在进行中，请稍候', 'warn'); return; }
  const token = $('token').value.trim(), repo = $('repo').value.trim();
  if(!token) return alert('请先填写 GitHub Token');
  if(!repo) return alert('请先填写仓库名');
  try{
    const me = await gh(token, 'https://api.github.com/user');
    $('repoDot').classList.add('on');
    log(`Token 有效，当前账号：${me.login}`, 'ok');
  }catch(e){
    log(`✗ Token 校验失败：${e.friendly || e.message}`, 'err');
    $('logBox').open = true;
    return;
  }

  const queue = books.map((b, i) => ({ b, i })).filter(({ b }) => b.state === 'ready');
  const total = queue.length;
  if(!total){ log('没有已就绪的书', 'warn'); return; }

  /* 批量前统一查一遍重名：这是"丢书"最隐蔽的一种 ——
     不报错、不失败，只是后一本把前一本盖掉，README 里最后只剩一本。
     与其传完才发现，不如传之前拦住。 */
  refreshFolderWarnings();
  const clashes = [...dupFolders().entries()].filter(([, idx]) => idx.length > 1);
  if(clashes.length){
    log('✗ 有书用了同一个仓库文件夹，已阻止批量上传：', 'err');
    clashes.forEach(([f, idx]) =>
      log(`    「${f}」 ← ${idx.map(k => books[k].name).join('、')}`, 'err'));
    log('    同名会互相覆盖，请把其中一本的文件夹名改掉再传。', 'err');
    $('logBox').open = true;
    return;
  }

  busy = true;
  const btn = $('uploadAll');
  const oldText = btn.textContent;
  btn.disabled = true; btn.textContent = '上传中';
  progStart('准备上传…', 0, 100);

  // 书籍串行上传（不做书籍级并发）。
  //
  // 原先多本书并发上传，有两个问题：
  //  1) 多个 worker 共享同一个 progState.base/span，各自反复改写导致进度乱跳
  //     （体现是上传到 85% 就归 0）；
  //  2) 每本书开头都 progSet(0)，视觉上就是“重新上传”。
  // 而书籍内部的 blob 已经是 12 路并发（大头在那里），
  // 再叠加书籍级并发不会快什么，只会增加 ref 竞态风险。
  let doneCount = 0, failedCount = 0;
  for(let idx = 0; idx < queue.length; idx++){
    const { b, i } = queue[idx];
    // 本书占一段：已完成的占前面，当前这本在后面
    progState.base = (doneCount / total) * 100;
    progState.span = 100 / total;
    progState.text = `上传中 <b>${idx + 1}</b> / ${total}（${escapeHtml(b.name)}）`;
    progSet(0, progState.text);
    b.inBatch = true;
    try{
      await doUpload(i);
      if(b.state === 'err') failedCount++;
    }catch(e){
      failedCount++;
      log(`✗ [${b.name}] 上传异常：${e.friendly || e.message}`, 'err');
    }finally{ b.inBatch = false; }
    doneCount++;
    // 本书占比到 100%，下一本从这里继续（而不是归 0）
    progSet(100);
    render();
  }
  /* 逐本给一句结论。书多了以后，通篇日志里翻"这本到底传了没"很费劲，
     而"一本动了、一本没动"恰好是最容易被误判成故障的现象。 */
  try{
    log('── 本次结果 ──', 'info');
    let moved = 0, still = 0;
    for(const { b } of queue){
      const r = b.lastResult || {};
      if(b.state === 'err'){
        log(`  ✗ ${b.name}：失败，没进仓库`, 'err');
      }else if(r.held){
        log(`  ⚠ ${b.name}：${r.held} 个文件内容和仓库不一样，但被「已存在文件一律不覆盖」挡住了`, 'warn');
        still++;
      }else if(!r.uploaded){
        const md = (r.sameFiles || []).find(p => /\.md$/i.test(p));
        log(`  ○ ${b.name}：一个文件都没提交 —— 转换结果和仓库里已有的完全一致` +
            (md ? `（含 ${baseName(md)}）` : ''), 'info');
        still++;
      }else{
        log(`  ✔ ${b.name}：提交 ${r.uploaded} 个文件` +
            (r.skipped ? `，另有 ${r.skipped} 个未变化` : ''), 'ok');
        moved++;
      }
    }
    log(`  共 ${queue.length} 本：${moved} 本有更新，${still} 本没有变化`, moved ? 'ok' : 'info');
    if(still && !moved){
      log('  提示：这些书的内容确实和仓库里一样，不是上传失败。若你刚改过转换逻辑，' +
          '请确认是重新拖入文件触发了重新转换，而不是点列表里那条旧记录。', 'warn');
    }
    progEnd(failedCount ? `完成：成功 ${total - failedCount} 本，失败 ${failedCount} 本`
                       : `全部完成：${total} 本，${moved} 本有更新`, failedCount === 0);
  }catch(e){
    progEnd('中断：' + (e.friendly || e.message), false);
  }finally{
    busy = false;
    btn.disabled = false; btn.textContent = oldText;
    render();
  }
}

/* =========================================================================
   12.5 草稿暂存：刷新页面不丢
   =========================================================================
   以前刷新一下页面 = 全部重来：书要重新拖进来、重新转换，改过的正文和文件夹名全没。
   现在把每本书存进 IndexedDB —— 正文、配图字节、自检结果、文件夹名，
   连原始的 EPUB/PDF 文件对象一起存（File 是可以结构化克隆的），
   所以刷新后不只是"看得到"，而是能直接重新转换、直接上传。

   一本书拆成两条记录：
     :meta（正文等文本，几 KB ~ 几 MB）改动频繁，打字时就存；
     :bin（原文件 + 配图，动辄几十 MB）只在转换完成后存一次。
   合成一条的话，每敲一个字都要把几十 MB 的配图重新克隆一遍。 */

const DRAFT_DB = 'book2md-drafts';
const DRAFT_VER = 1;
let draftDb = null, draftBroken = false, draftBinFail = false;

function openDraftDb(){
  if(draftDb) return Promise.resolve(draftDb);
  if(draftBroken) return Promise.resolve(null);
  return new Promise(resolve => {
    let req;
    try{ req = indexedDB.open(DRAFT_DB, DRAFT_VER); }
    catch(e){ draftBroken = true; return resolve(null); }
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains('draft')) db.createObjectStore('draft');
    };
    req.onsuccess = () => { draftDb = req.result; resolve(draftDb); };
    req.onerror = () => { draftBroken = true; resolve(null); };
  });
}

function idbTx(mode, fn){
  return openDraftDb().then(db => {
    if(!db) throw new Error('no-idb');
    return new Promise((res, rej) => {
      const tx = db.transaction('draft', mode);
      let out;
      try{ out = fn(tx.objectStore('draft')); }catch(e){ return rej(e); }
      tx.oncomplete = () => res(out);
      tx.onerror = tx.onabort = () => rej(tx.error || new Error('idb-fail'));
    });
  });
}

const draftPut = kv => idbTx('readwrite', st => { for(const [k, v] of kv) st.put(v, k); });
const draftDel = ks => idbTx('readwrite', st => { for(const k of ks) st.delete(k); });
const draftClear = () => idbTx('readwrite', st => st.clear());
function draftKeys(){
  return idbTx('readonly', st => new Promise(res => {
    const out = [];
    const rq = st.openCursor();
    rq.onsuccess = () => { const c = rq.result; if(!c) return res(out); out.push(c.key); c.continue(); };
    rq.onerror = () => res(out);
  }));
}
function draftReadAll(){
  return idbTx('readonly', st => {
    const out = [];
    return new Promise(res => {
      const rq = st.openCursor();
      rq.onsuccess = () => { const c = rq.result; if(!c) return res(out); out.push([c.key, c.value]); c.continue(); };
      rq.onerror = () => res(out);
    });
  });
}

function newBookId(){
  return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/** 标记改动并安排一次保存（防抖 900ms：连续打字只存最后一次） */
let draftTimer = 0;
let draftTouched = false;      // 本次会话确实写过草稿（没写过就不该去清空别人的存档）
function saveDrafts(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => flushDrafts(), 900);
}

async function flushDrafts(){
  /* 一本书都不剩时才清库，而且必须是"这次真的写过"才清 ——
     否则页面刚打开、草稿还没读回来就先被清掉了。 */
  if(!books.length){
    if(draftTouched){ draftTouched = false; try{ await draftClear(); }catch(e){} }
    return;
  }
  draftTouched = true;
  const now = Date.now();
  const alive = new Set();
  for(const b of books){ if(!b.id) b.id = newBookId(); alive.add(b.id); }
  /* 被移除的那本书的存档必须显式删掉：只 put 不 delete 的话，
     删掉的书刷新之后又自己回来了，怎么删都删不掉。 */
  try{
    const keys = await draftKeys();
    const dead = keys.filter(k => !alive.has(String(k).replace(/:(meta|bin)$/, '')));
    if(dead.length) await draftDel(dead);
  }catch(e){}
  const kv = [], bin = [], binIds = [];
  for(const b of books){
    if(!b.id) b.id = newBookId();
    kv.push([b.id + ':meta', {
      name: b.name, kind: b.kind, size: b.size || 0, folder: b.folder || '',
      state: b.state, stateLabel: b.stateLabel || '',
      keepOrig: !!b.keepOrig, skipExisting: !!b.skipExisting, edited: !!b.edited,
      markdown: b.markdown || '', meta: b.meta || {},
      cover: b.cover && b.cover.bytes ? { name: b.cover.name, bytes: b.cover.bytes } : null,
      check: b.check || null, savedAt: now
    }]);
    /* 二进制只在"内容真的换过"时才重写：转换完成会置 _binDirty，
       单纯改文件夹名或改正文不该触发几十 MB 的重新克隆。 */
    if(b._binDirty !== false){ bin.push([b.id + ':bin', { file: b.file || null, images: [...(b.images || [])] }]); binIds.push(b); }
  }
  try{
    await draftPut(kv);
    for(const b of books) if(binIds.indexOf(b) < 0) b._binDirty = false;
  }catch(e){
    if(!draftBroken){ draftBroken = true; log('⚠ 浏览器不允许本地存档（可能用了无痕模式），刷新页面草稿会丢', 'warn'); }
    return;
  }
  if(bin.length){
    try{ await draftPut(bin); for(const b of binIds) b._binDirty = false; }
    catch(e){
      // 配额不够也别把整本书的存档废掉：正文还在，只是原文件和配图存不下
      if(!draftBinFail){
        draftBinFail = true;
        log(`⚠ 配图和原文件太大，本地存不下（${e && e.name || '配额不足'}）：刷新后能恢复正文，但需要重新拖入原文件才能重新转换`, 'warn');
      }
    }
  }
}

/** 启动时把草稿读回来。返回 true 表示确实恢复了东西。 */
async function restoreDrafts(){
  let rows;
  try{ rows = await draftReadAll(); }
  catch(e){ return false; }
  if(!rows || !rows.length) return false;
  const meta = new Map(), bin = new Map();
  for(const [k, v] of rows){
    if(k.endsWith(':meta')) meta.set(k.slice(0, -5), v);
    else if(k.endsWith(':bin')) bin.set(k.slice(0, -4), v);
  }
  const ids = [...meta.keys()].sort((a, c) => (meta.get(a).savedAt || 0) - (meta.get(c).savedAt || 0));
  let n = 0;
  for(const id of ids){
    const m = meta.get(id), bn = bin.get(id) || {};
    if(!m || !m.name) continue;
    const b = {
      id, file: bn.file || null, name: m.name, size: m.size || 0, kind: m.kind || 'epub',
      folder: m.folder || safeFolder(m.name.replace(/\.[^.]+$/, '')),
      state: m.state === 'converting' ? 'pending' : (m.state || 'pending'),
      stateLabel: m.state === 'converting' ? '待转换' : (m.stateLabel || ''),
      markdown: m.markdown || '', images: bn.images || [], base64: null, origB64: null,
      edited: !!m.edited, keepOrig: !!m.keepOrig, skipExisting: !!m.skipExisting,
      meta: m.meta || {}, cover: m.cover || null, check: m.check || null,
      restored: true, _binDirty: false
    };
    /* 原文件没存下来（配额不够）就没法重新转换，但正文还在 —— 说清楚，
       别让人对着一本"能看不能传"的书猜。 */
    if(!b.file) b.noFile = true;
    /* PDF 的上传内容是 base64，没存（太占地方）—— 原文件在，就地重读一遍即可。 */
    if(b.kind === 'pdf' && b.file){
      b.state = 'loading'; b.stateLabel = '读取中';
      const fr = new FileReader();
      fr.onload = () => {
        b.base64 = String(fr.result).split(',')[1] || '';
        b.state = 'ready'; b.stateLabel = '已就绪';
        try{ render(); }catch(e){}
      };
      fr.onerror = () => { b.state = 'err'; b.stateLabel = '读取失败'; try{ render(); }catch(e){} };
      fr.readAsDataURL(b.file);
    }
    books.push(b);
    n++;
  }
  if(!n) return false;
  draftTouched = true;
  const when = meta.get(ids[ids.length - 1]).savedAt || 0;
  const ago = when ? Math.max(0, Math.round((Date.now() - when) / 60000)) : 0;
  const whenTxt = ago < 1 ? '刚刚' : ago < 60 ? `${ago} 分钟前` : `${Math.round(ago / 60)} 小时前`;
  log(`已恢复上次未完成的 ${n} 本书（存于${whenTxt}）：正文、配图${books.some(b => !b.noFile) ? '、原文件' : ''}都在，可直接继续`, 'ok');
  if(books.some(b => b.noFile))
    log('  其中有的书没有存下原文件（太大），能看能改正文，但重新转换和上传需要再拖一次原书', 'warn');
  return true;
}

/** 彻底丢掉草稿（清空列表时调用） */
async function dropDrafts(){
  try{ await draftClear(); }catch(e){}
}


/* =========================================================================
   13. 事件绑定与初始化
   ========================================================================= */
(function init(){
  /* 本地存储：兼容旧版本的键名。
   *
   * 旧版用 `b2md_` 前缀 + JSON 序列化，重建后改成了 `b2m.` 前缀 + 纯字符串，
   * 结果用户之前存的 Token 读不到了。这里做一次迁移：先按新键读，读不到再回退旧键
   * （旧值是 JSON 字符串，需要 parse），读到后顺手写成新键。 */
  const OLD_PREFIX = 'b2md_';
  const readOld = k => {
    try{
      const raw = localStorage.getItem(OLD_PREFIX + k);
      if(raw == null) return undefined;
      try{ return JSON.parse(raw); }catch(e){ return raw; }   // 老数据是 JSON.parse 过的
    }catch(e){ return undefined; }
  };
  const LS = {
    get(k, d){
      try{
        const v = localStorage.getItem('b2m.' + k);
        if(v != null) return v;
      }catch(e){}
      const old = readOld(k);
      if(old !== undefined){
        try{ localStorage.setItem('b2m.' + k, String(old)); }catch(e){}
        return String(old);
      }
      return d;
    },
    set(k, v){ try{ localStorage.setItem('b2m.' + k, v); }catch(e){} }
  };

  // 旧版的键名对照
  const v0 = LS.get('visibility', '');
  $('token').value = LS.get('token', '');
  $('repo').value = LS.get('repo', '');
  $('visibility').checked = (v0 === '1' || v0 === 'true');
  $('batchCommit').checked = LS.get('batch', '1') !== '0';
  $('autoConvert').checked = LS.get('auto', '1') !== '0';
  $('skipExistingAll').checked = LS.get('skip', '') === '1';
  $('keepOrigAll').checked = LS.get('keepOrig', '') === '1';
  skipExisting = $('skipExistingAll').checked;
  useBatchCommit = $('batchCommit').checked;
  autoConvert = $('autoConvert').checked;

  // 迁移提示：旧版存的 Token 找到了就说明一声，免得以为"保存的信息不见了"
  try{
    if(readOld('token') && !$('token').value) log('未能恢复上次的 Token，请重新填写', 'warn');
    else if($('token').value) log('已恢复上次保存的 Token 与仓库设置', 'ok');
  }catch(e){}

  $('token').addEventListener('change', () => LS.set('token', $('token').value.trim()));
  $('repo').addEventListener('change', () => LS.set('repo', $('repo').value.trim()));
  $('visibility').addEventListener('change', () => LS.set('visibility', $('visibility').checked ? '1' : ''));
  $('batchCommit').addEventListener('change', () => { useBatchCommit = $('batchCommit').checked; LS.set('batch', useBatchCommit ? '1' : '0'); });
  $('autoConvert').addEventListener('change', () => { autoConvert = $('autoConvert').checked; LS.set('auto', autoConvert ? '1' : '0'); });
  $('skipExistingAll').addEventListener('change', () => { skipExisting = $('skipExistingAll').checked; LS.set('skip', skipExisting ? '1' : ''); });
  /* 勾上/取消"保留原件"要立刻同步到已添加的书。
     以前只在加书那一刻读一次勾选框，之后改框对已加的书完全无效 ——
     用户以为勾上了、上传后却没有原件，只能怀疑是工具没生效。 */
  $('keepOrigAll').addEventListener('change', () => {
    const on = $('keepOrigAll').checked;
    LS.set('keepOrig', on ? '1' : '');
    books.forEach(b => { if(b.kind === 'epub') b.keepOrig = on; });
    log(on ? '已勾上「保留 EPUB 原件」：现有和后续加入的书都会一并上传 .epub 原件'
           : '已取消「保留 EPUB 原件」：只传 Markdown 和配图', 'info');
  });

  $('uploadAll').onclick = uploadAll;
  $('convertAll').onclick = convertAll;
  $('clearAll').onclick = () => {
    books.forEach(releaseImgUrls);
    books.length = 0; sharedRepoInfo = null; render();
    dropDrafts();       // 列表清空 = 草稿也一起丢，别让刷新后又冒出来
    log('已清空列表（草稿也一起删了）', 'info');
  };
  $('refreshBtn').onclick = async () => {
    const token = $('token').value.trim(), repo = $('repo').value.trim();
    if(!token || !repo) return alert('请先填写 Token 和仓库名');
    try{
      const info = await repoInfo(token, repo);
      sharedRepoInfo = Object.assign(info, { key: repo.trim() });
      $('repoDot').classList.add('on');
      const files = await listAllFiles(token, info);
      log(`仓库 ${info.full} 现有 ${files.length} 个文件，分支 ${info.default_branch}`, 'ok');
      progEnd(`仓库 ${info.full}：${files.length} 个文件`);
    }catch(e){
      log(`✗ ${e.friendly || e.message}`, 'err');
      $('logBox').open = true;
    }
  };

  $('rebuildBtn').onclick = rebuildReadme;
  $('manageBtn').onclick = () => {
    const p = $('repoPanel');
    const show = p.style.display === 'none';
    p.style.display = show ? '' : 'none';
    if(show) loadRepoBooks();
  };
  $('rpReload').onclick = () => loadRepoBooks();
  $('rpClose').onclick = () => { $('repoPanel').style.display = 'none'; };

  const drop = $('drop'), input = $('fileInput');
  drop.onclick = () => input.click();
  input.onchange = () => { if(input.files.length) addFiles([...input.files]); input.value = ''; };
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => {
    const fs = [...(e.dataTransfer?.files || [])];
    if(fs.length) addFiles(fs);
  });

  // 启动时把关键信息写进日志，用户一看就知道自己打开的是哪个版本、
  // 浏览器能力够不够。凡是出问题可能是“缓存了旧版”或「浏览器太旧」，
  // 先看这两行比什么都有效。
  try{
    const v = document.documentElement.dataset.v || '未标注';
    log(`book2md v${v} 已加载 · 浏览器 ${navigator.userAgent.slice(0, 50)}`, 'info');
    if(typeof DecompressionStream === 'function') log('压缩解压：可用（内置 API）', 'ok');
    else log('压缩解压：不可用（浏览器过旧）', 'err');
    // 直接打开本地文件时，部分浏览器会禁用 file:// 页面的本地存储，导致 Token 保不住、
    // 还有些会拒绝 fetch 到 file://。提醒一下就能省很多问题的排查时间。
    if(location.protocol === 'file:'){
      log('目前用直接打开文件的方式运行。若 Token 无法保存或上传失败，请改用本页最下方的 Python 服务访问（http://127.0.0.1:8787）', 'info');
    }
    /* 这个设置是持久化的，很容易"忘了自己勾过"，然后重传什么都更新不了。
       启动就说清楚，比等用户发现 GitHub 上没变化再回头猜省事得多。 */
    if($('skipExistingAll').checked){
      log('⚠ 「已存在文件一律不覆盖」当前是勾上的：重传已上传的书，内容变了也不会提交，GitHub 上不会有新记录。想更新请先取消勾选。', 'warn');
      $('logBox').open = true;
    }
  }catch(e){}

  // 浏览器能力预检：不支持 DecompressionStream 就无法读 EPUB，
  // 提前告知比让用户很久才看到“没反应”好了。
  try{
    if(typeof DecompressionStream !== 'function'){
      log('⚠ 当前浏览器过旧，无法解压 EPUB。请用 Chrome 80+ / Edge 80+ / Safari 16.4+ / Firefox 113+ 。', 'err');
      $('fileInput').disabled = true;
      $('drop').style.opacity = '.5';
      $('drop').style.pointerEvents = 'none';
    }
  }catch(e){}

  /* 按钮的可用状态跟 Token / 仓库名挂钩。以前只监听 change（失焦才触发），
     用户刚填完还没点别处时，"读取仓库""管理仓库书籍"一直是灰的，看着像坏了。 */
  ['token', 'repo'].forEach(id => $(id).addEventListener('input', updateButtonsAndSummary));

  render();
  progIdle('空闲');

  /* 草稿恢复放在最后：先让界面完整画出来，再把上次没做完的书读回来重画一次。
     读不到就是没有草稿，一句话也不用说 —— 只有真的恢复了才值得占一行日志。 */
  restoreDrafts().then(ok => {
    if(ok){ render(); $('logBox').open = true; }
  }).catch(() => {});
})();
</script>
</body>
</html>
