<!DOCTYPE html>
<html lang="zh-CN" data-v="2026-10-21.8">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>book2md v2026-10-20 · EPUB/PDF → Markdown → GitHub</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --line2:#eef0f3;
    --text:#1b1f24; --text2:#57606a; --muted:#8b949e;
    --brand:#3b5bdb; --brand-d:#2f49b2; --ok:#1a7f37; --warn:#9a6700; --err:#c1121f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:960px;margin:0 auto;padding:22px 20px 80px}

  /* ---------- 版本条：确认打开的是新文件 ---------- */
  .verbar{
    font-size:11.5px;color:var(--muted);margin-bottom:10px;
    padding:5px 10px;background:#eef2ff;border:1px solid #d5ddfb;border-radius:7px;
  }
  .verbar b{color:#34418f;font-weight:600}

  /* ---------- 顶栏：仓库连接 ---------- */
  .top{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .top-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .field{display:flex;align-items:center;gap:7px;background:#fbfcfd;border:1px solid var(--line);border-radius:8px;padding:5px 10px;flex:1;min-width:180px}
  .field .lbl{font-size:11px;color:var(--muted);flex:none}
  .field input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:13px;outline:none;color:var(--text)}
  .field input::placeholder{color:#b6bcc4}
  .dot{width:8px;height:8px;border-radius:50%;background:#d0d7de;flex:none}
  .dot.on{background:var(--ok)}

  button{font:inherit;font-size:13px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:7px 13px;cursor:pointer;color:var(--text2);white-space:nowrap}
  button:hover:not(:disabled){background:#f6f8fa}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.primary:hover:not(:disabled){background:var(--brand-d)}
  button:disabled{opacity:.42;cursor:not-allowed}
  button.sm{font-size:12px;padding:5px 10px}
  button.danger{color:#cf222e;border-color:#f0b8bb}
  button.danger:hover:not(:disabled){background:#fdecec}
  input[type=text],input[type=password],textarea{font:inherit}

  /* ---------- 仓库书籍管理（改名 / 删除） ---------- */
  .repo-panel{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:10px;overflow:hidden}
  .rp-hd{display:flex;align-items:center;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line);font-size:12.5px}
  .rp-hd .sp{flex:1}
  .rp-list{display:flex;flex-direction:column}
  .rp-row{display:flex;align-items:center;gap:8px;padding:8px 13px;border-top:1px solid var(--line);font-size:12.5px;flex-wrap:wrap}
  .rp-row:first-child{border-top:none}
  .rp-row.gone{opacity:.5}
  .rp-name{font-weight:600;min-width:110px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rp-meta{color:var(--muted);font-size:11.5px;flex:1;min-width:110px}
  .rp-row input[type=text]{flex:none;width:190px;font-size:12px;padding:4px 8px}
  .rp-tip{padding:14px 13px;color:var(--muted);font-size:12.5px}

  /* ---------- 投放区 ---------- */
  .drop{border:1.5px dashed #d0d7de;border-radius:10px;background:var(--panel);padding:24px;text-align:center;cursor:pointer;margin-bottom:12px}
  .drop:hover,.drop.over{border-color:var(--brand);background:#f4f6ff}
  .drop b{display:block;font-size:14px;margin-bottom:3px;font-weight:560}
  .drop span{font-size:12px;color:var(--muted)}
  .drop input{display:none}

  /* ---------- 进度（常驻） ---------- */
  .prog{display:flex;align-items:center;gap:12px;padding:9px 14px;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .prog.off{opacity:.4}
  .prog-txt{flex:1;min-width:0;font-size:12.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prog-txt b{color:var(--text);font-weight:600}
  .track{flex:0 0 200px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
  .track i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}
  .pct{font-size:11.5px;color:var(--muted);width:34px;text-align:right;font-variant-numeric:tabular-nums}

  /* ---------- 书目：紧凑行 ---------- */
  .list{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .row-h{display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer}
  .row-h:hover{background:#fbfcfd}
  .row-h .caret{flex:none;color:var(--muted);font-size:10px;transition:transform .15s;display:inline-block}
  .row.open .row-h .caret{transform:rotate(90deg)}
  .row-h .quick{display:inline-flex;gap:6px;flex:none}
  .row.open .row-h .quick{display:none}
  .row-b{padding:9px 13px 11px;border-top:1px solid var(--line2);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
  .row:not(.open) .row-b{display:none}
  .ftype{flex:none;width:34px;height:34px;border-radius:7px;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;background:#8b949e}
  .ftype.epub{background:#6657c8} .ftype.pdf{background:#c05621}
  .fname{flex:1;min-width:0}
  .fname b{display:block;font-size:13.5px;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fname span{font-size:11.5px;color:var(--muted)}
  .tag{flex:none;font-size:11px;padding:2.5px 9px;border-radius:20px;font-weight:560;background:#eef1f5;color:var(--text2)}
  .tag.ok{background:#e7f6ec;color:var(--ok)}
  .tag.warn{background:#fff4e5;color:var(--warn)}
  .tag.err{background:#fdecec;color:var(--err)}
  .tag.busy{background:#e8ecfd;color:var(--brand)}
  .row-b input[type=text]{flex:1;min-width:160px;font-size:12.5px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;outline:none}
  .row-b textarea{width:100%;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:7px;outline:none;resize:vertical;margin-top:7px}
  .warnbox{width:100%;padding:7px 10px;border-radius:7px;background:#fff8e8;font-size:11.5px;color:var(--warn);line-height:1.5}
  .errbox{width:100%;padding:7px 10px;border-radius:7px;background:#fdecec;font-size:11.5px;color:var(--err);line-height:1.5}
  .pv{border:1px solid var(--line);border-radius:7px;padding:10px;margin-top:7px;background:#fff;overflow:auto;max-height:400px;font-size:13px}

  /* ---------- 汇总 / 自检 ---------- */
  .ck-panel{margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
  .ck-panel.sum{display:flex;align-items:center;gap:9px;padding:8px 13px}
  .dup-hint{margin-bottom:10px;padding:9px 13px;border:1px solid #f0c36d;border-left:3px solid #d4a72c;
            border-radius:8px;background:#fff8e6;color:#6b4c00;font-size:12.5px;line-height:1.7}
  input.dup,input.dup:focus{border-color:#cf222e!important;box-shadow:0 0 0 2px rgba(207,34,46,.12)!important}
  .ck-hd{display:flex;align-items:center;gap:9px;padding:8px 13px;cursor:pointer;font-size:12.5px}
  .ck-hd:hover{background:#fbfcfd}
  .ck-badge{flex:none;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600}
  .ck-badge.ok{background:#e7f6ec;color:var(--ok)}
  .ck-badge.warn{background:#fff4e5;color:var(--warn)}
  .ck-badge.err{background:#fdecec;color:var(--err)}
  .ck-sum{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ck-toggle{color:var(--muted);font-size:11px}
  .ck-list{list-style:none;margin:0;padding:0 0 6px}
  .ck-list li{display:flex;gap:7px;padding:4px 13px;font-size:11.5px;line-height:1.5;color:var(--text2)}
  .ck-list li.err{color:#a0131d} .ck-list li.warn{color:#8a5a00}

  /* ---------- 操作区 ---------- */
  .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .acts .sp{flex:1}
  .adv{display:flex;gap:14px;flex-wrap:wrap;padding:9px 13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--muted)}
  .adv label{display:flex;gap:5px;align-items:center;cursor:pointer}

  /* ---------- 日志 ---------- */
  .logbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:10px}
  .logbox summary{padding:9px 13px;cursor:pointer;font-size:12.5px;color:var(--text2);list-style:none;display:flex;align-items:center;gap:7px}
  .logbox summary::-webkit-details-marker{display:none}
  .logbox summary:before{content:"\25B8";color:var(--muted);font-size:10px}
  .logbox[open] summary:before{content:"\25BE"}
  .log{max-height:300px;overflow:auto;padding:0 13px 12px;font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text2);white-space:pre-wrap}
  .log .ok{color:var(--ok)} .log .err{color:var(--err)} .log .warn{color:var(--warn)} .log .info{color:var(--text2)}
  .empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 版本标识：一眼确认打开的是新文件还是旧文件（目录里还有 preview_sample.html 等旧版） -->
  <div class="verbar">book2md <b>v2026-10-21.6</b> · 重复配图只传一份 · 原件按需算 · 星号不再露出 · 大书编辑不卡 · 重名会拦 · 逐字加粗自动并接头 · 预览与 GitHub 一致 · 预览能看真图 · 存成 HTML · 首页带封面与生成时间 · 无封面自动补 · 跳过原因会明说 · 标题不跳级</div>

  <!-- 1 仓库连接 -->
  <div class="top">
    <div class="top-row">
      <span class="dot" id="repoDot"></span>
      <div class="field"><span class="lbl">仓库</span><input type="text" id="repo" placeholder="owner/repo 或仅名字" autocomplete="off" /></div>
      <div class="field" style="flex:0 1 220px"><span class="lbl">Token</span><input type="password" id="token" placeholder="ghp_..." autocomplete="off" /></div>
      <label class="adv" style="padding:5px 10px"><input type="checkbox" id="visibility" /> 私有</label>
      <button class="sm" id="btnRepo">打开</button>
    </div>
  </div>

  <!-- 2 投放 -->
  <div class="drop" id="drop">
    <input type="file" id="fileInput" accept=".pdf,.epub" multiple />
    <b>拖入 EPUB / PDF，或点击选择（可多选）</b>
    <span>EPUB 自动转成 Markdown · PDF 原样上传</span>
  </div>

  <!-- 3 进度 -->
  <div class="prog off" id="prog1">
    <div class="prog-txt" id="progTxt">空闲</div>
    <div class="track"><i id="progBar"></i></div>
    <div class="pct" id="progPct">0%</div>
  </div>

  <!-- 4 自检汇总 -->
  <div class="ck-panel sum" id="ckSum" style="display:none"></div>

  <!-- 4.5 文件夹重名提示：两本书撞同一个目录会静默覆盖，必须让人看见 -->
  <div class="dup-hint" id="dupHint" style="display:none"></div>

  <!-- 5 书目 -->
  <div class="list" id="bookList"></div>
  <div class="empty" id="emptyHint">还没有文件。上面拖进来就能开始。</div>

  <!-- 6 操作 -->
  <div class="acts">
    <button class="primary" id="uploadAll" disabled>上传全部已就绪</button>
    <button id="convertAll" disabled>转换全部待处理</button>
    <button class="sm" id="refreshBtn" disabled>读取仓库</button>
    <button class="sm" id="manageBtn" disabled title="改名或删除仓库里已经有的书">管理仓库书籍</button>
    <button class="sm" id="rebuildBtn" disabled title="重新扫描仓库并在首页重建书目">重建首页</button>
    <div class="sp"></div>
    <button class="sm" id="clearAll" disabled>清空</button>
  </div>

  <!-- 6.5 仓库里已有的书：改名 / 删除 -->
  <div class="repo-panel" id="repoPanel" style="display:none">
    <div class="rp-hd">
      <b>仓库里的书</b>
      <span class="ck-sum" id="rpTip">读取中…</span>
      <div class="sp"></div>
      <button class="sm" id="rpReload">重新读取</button>
      <button class="sm" id="rpClose">收起</button>
    </div>
    <div class="rp-list" id="rpList"></div>
  </div>

  <div class="adv">
    <label><input type="checkbox" id="batchCommit" checked /> 整本书合并为 1 个提交</label>
    <label><input type="checkbox" id="autoConvert" checked /> 加入文件后自动转换</label>
    <label title="勾上后，仓库里同名的文件一律不覆盖——哪怕你本地的内容已经变了。想更新已上传的书，请保持不勾。"><input type="checkbox" id="skipExistingAll" /> 已存在文件一律不覆盖（内容变了也不覆盖）</label>
    <label><input type="checkbox" id="keepOrigAll" /> 保留 EPUB 原件</label>
  </div>

  <!-- 7 日志 -->
  <details class="logbox" id="logBox">
    <summary>运行日志</summary>
    <div class="log" id="log">（暂无）</div>
  </details>

</div>
<script>

/* =========================================================================
   1. 基础工具
   ========================================================================= */
const $ = id => document.getElementById(id);
const enc = new TextEncoder();
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* 让浏览器有机会重绘一帧（转换整章是纯同步的 DOM 活，连着跑进度条就定住不动）。
   setTimeout(0) 是宏任务，能让浏览器插入一次绘制。
   但每次都让出会把转换拖慢（浏览器对嵌套定时器有 ~4ms 下限，实测 300 章的书能慢 20%+），
   所以加了节流：两次重绘之间至少隔 100ms 的活儿 —— 一秒更新十次，看着就是连续的，
   而让出的开销压到总耗时的百分之几。收尾那次强制让出。 */
let _lastPaint = 0;
async function paint(force){
  const now = Date.now();
  if(!force && now - _lastPaint < 100) return;
  _lastPaint = now;
  await sleep(0);
}

function escapeHtml(s){
  return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function fmtSize(n){
  if(!n && n !== 0) return '-';
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(2) + ' MB';
}
/**
 * 给没有封面的书生成一张文字封面（SVG）。
 *
 * PDF 和直接上传的 .md **本来就不带封面** —— 封面只在解析 EPUB 时从 OPF 里取，
 * 这两条路径压根没有这一步。于是 README 里那一格只能写「无封面」，
 * 一排书看过去像坏了几本，其实是源文件就没有。
 *
 * 这里补一张纯静态 SVG：底色按书名哈希取（同一本书永远同一个色），书名居中，
 * 底部标文件类型。几 KB、零依赖、GitHub 直接渲染。
 * 故意做成"一看就是占位"的样子（浅色底 + 虚线框），不冒充真封面。
 */
/**
 * 导出一份**自包含**的 HTML：图片全部内嵌成 data URI。
 *
 * 为什么要这个：网页里的预览是临时的，关了页面就没了；而且预览区窄、图看不全。
 * 存成 HTML 之后可以用浏览器全屏看、可以搜、可以发给别人确认，不发原书也不会裂图。
 * 上传前先看一遍，比传上去再回滚省事得多。
 */
function exportPreviewHtml(b){
  const mimeOf = name => {
    const ext = (String(name).match(/\.([a-z0-9]+)$/i) || [, 'jpg'])[1].toLowerCase();
    return ext === 'png' ? 'image/png' : ext === 'gif' ? 'image/gif'
         : ext === 'svg' ? 'image/svg+xml' : ext === 'webp' ? 'image/webp'
         : ext === 'bmp' ? 'image/bmp' : 'image/jpeg';
  };
  const map = new Map();
  for(const [name, bytes] of (b.images || [])){
    try{ map.set('images/' + name, 'data:' + mimeOf(name) + ';base64,' + bytesToBase64(bytes)); }catch(e){}
  }
  const title = String((b.meta && b.meta.title) || b.folder || b.name || 'book').trim();
  const body = renderMdPreview(b.markdown || '', map);
  const chars = (b.markdown || '').length;

  const css = [
    ':root{color-scheme:light}',
    '*{box-sizing:border-box}',
    'body{margin:0;padding:28px 20px 90px;background:#fff;color:#1f2328;',
    'font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}',
    '.meta{max-width:820px;margin:0 auto 26px;padding-bottom:12px;border-bottom:1px solid #d8dee4;',
    'color:#59636e;font-size:13px;display:flex;gap:16px;flex-wrap:wrap}',
    'article{max-width:820px;margin:0 auto}',
    'h1,h2,h3,h4,h5,h6{line-height:1.3;margin:1.5em 0 .6em;font-weight:600}',
    'h1{font-size:1.85em;border-bottom:1px solid #d8dee4;padding-bottom:.3em;margin-top:0}',
    'h2{font-size:1.45em;border-bottom:1px solid #d8dee4;padding-bottom:.3em}',
    'h3{font-size:1.2em}h4{font-size:1.05em}h5{font-size:1em}h6{font-size:.95em;color:#59636e}',
    'p{margin:.85em 0}a{color:#0969da;text-decoration:none}a:hover{text-decoration:underline}',
    'img{max-width:100%;height:auto;display:block;margin:1.1em auto;border-radius:4px}',
    'blockquote{margin:1em 0;padding:0 1em;color:#59636e;border-left:.25em solid #d0d7de}',
    'code{background:#f6f8fa;padding:.2em .4em;border-radius:4px;font-size:.9em;',
    'font-family:ui-monospace,SFMono-Regular,Consolas,monospace}',
    'pre{background:#f6f8fa;padding:14px;border-radius:6px;overflow:auto}',
    'pre code{background:none;padding:0}',
    'table{border-collapse:collapse;margin:1em 0;display:block;overflow:auto;max-width:100%}',
    'th,td{border:1px solid #d0d7de;padding:6px 13px}',
    'th{background:#f6f8fa;font-weight:600}',
    'hr{border:none;border-top:1px solid #d8dee4;margin:2em 0}',
    'ul,ol{padding-left:1.8em;margin:.85em 0}li{margin:.3em 0}del{color:#8b949e}'
  ].join('');

  return '<!doctype html><html lang="zh-CN"><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<title>' + escapeHtml(title) + '</title>'
    + '<style>' + css + '</style><body>'
    + '<div class="meta"><b>' + escapeHtml(title) + '</b>'
    + '<span>book2md 本地预览</span>'
    + '<span>' + (b.images || []).length + ' 张配图</span>'
    + '<span>' + chars + ' 字符</span></div>'
    + '<article>' + body + '</article></body></html>';
}

function makeTextCover(title, kind){
  const esc = x => String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const name = String(title || '').trim() || '未命名';
  let hue = 0;
  for(let i = 0; i < name.length; i++) hue = (hue * 31 + name.charCodeAt(i)) % 360;

  /* 折行按**视觉宽度**算，不能按字符个数。
     按个数折的话 "博弈skill"（7 个字符）会被切成 "博弈skil" + "l" —— 明显是坏的。
     中文算 1，拉丁/数字算 0.55，一行最多 6 个中文字的宽度。 */
  const chars = Array.from(name);
  const charW = c => c.charCodeAt(0) < 0x2e80 ? 0.55 : 1;
  const MAXW = 6;
  const lines = [];
  let i = 0;
  while(i < chars.length && lines.length < 3){
    while(i < chars.length && chars[i] === ' ') i++;   // 新行不以空格开头（英文书名）
    let cur = '', w = 0;
    while(i < chars.length && w + charW(chars[i]) <= MAXW + 1e-6){
      cur += chars[i]; w += charW(chars[i]); i++;
    }
    if(!cur){ cur = chars[i]; i++; }        // 兜底：单字符就超宽
    lines.push(cur);
  }
  if(i < chars.length) lines[lines.length - 1] = lines[lines.length - 1].slice(0, -1) + '…';

  const fs = lines.length === 1 ? 52 : lines.length === 2 ? 44 : 36;
  const gap = Math.round(fs * 1.22);
  const firstY = Math.round(200 - ((lines.length - 1) * gap) / 2);
  const tspans = lines.map((ln, i) =>
    '<tspan x="150"' + (i ? ' dy="' + gap + '"' : '') + '>' + esc(ln) + '</tspan>').join('');

  const label = kind === 'pdf' ? 'PDF' : kind === 'epub' ? 'EPUB' : 'MARKDOWN';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">\n'
    + '<rect width="300" height="400" fill="hsl(' + hue + ',30%,93%)"/>\n'
    + '<rect x="12" y="12" width="276" height="376" rx="8" fill="none" stroke="hsl(' + hue + ',26%,76%)" stroke-width="2" stroke-dasharray="7 6"/>\n'
    + '<text x="150" y="' + firstY + '" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,\'Segoe UI\',\'PingFang SC\',\'Microsoft YaHei\',sans-serif" '
    + 'font-size="' + fs + '" font-weight="600" fill="hsl(' + hue + ',38%,27%)">' + tspans + '</text>\n'
    + '<text x="150" y="352" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif" '
    + 'font-size="15" letter-spacing="3" fill="hsl(' + hue + ',18%,48%)">' + label + '</text>\n'
    + '</svg>';
}

/** 字数：中文阅读习惯用「万」计量，不足一万照实写 */
function fmtChars(n){
  const v = Number(n) || 0;
  if(!v) return '';
  if(v >= 10000) return (Math.round(v / 1000) / 10) + ' 万字';
  return v + ' 字';
}
function baseName(p){ return String(p).split('/').pop(); }
function dirName(p){ const i = String(p).lastIndexOf('/'); return i < 0 ? '' : String(p).slice(0, i); }

/** 路径规范化：解析 . 与 .. */
function normPath(base, rel){
  const parts = (base ? base.split('/') : []).concat(String(rel).split('/'));
  const out = [];
  for(const p of parts){
    if(!p || p === '.') continue;
    if(p === '..'){ out.pop(); continue; }
    out.push(p);
  }
  return out.join('/');
}

/** 百分号解码：容忍非法序列（如 "50%off"）而不抛错 */
function safeDecode(s){
  const t = String(s || '');
  try{ return decodeURIComponent(t); }
  catch(e){
    // 逐个转义还原，遇非法序列保留原样
    return t.replace(/%[0-9A-Fa-f]{2}/g, m => {
      try{ return decodeURIComponent(m); }catch(_){ return m; }
    });
  }
}

/** 文件夹名净化：防路径穿越 */
function safeFolder(name){
  let s = String(name || '').trim()
    .replace(/[\\/]+/g, '-')
    .replace(/\.\.+/g, '.')
    .replace(/[<>:"|?*\x00-\x1f]/g, '-')
    .replace(/^\.+|\.+$/g, '')
    .replace(/^-+|-+$/g, '')
    .trim();
  return s || 'book';
}

function bytesToBase64(bytes){
  let bin = '', chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return btoa(bin);
}
function b64ToBytes(b64){
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* =========================================================================
   2. SHA-1：本地算 git blob sha，用于"内容未变就跳过上传"
   ========================================================================= */
function sha1Hex(bytes){
  const K = [0x5a827999, 0x6ed9eba1, 0x8f1bbcdc, 0xca62c1d6];
  const ml = bytes.length * 8;
  const padded = new Uint8Array((((bytes.length + 8) >> 6) + 1) << 6);
  padded.set(bytes);
  padded[bytes.length] = 0x80;
  const dv = new DataView(padded.buffer);
  dv.setUint32(padded.length - 4, ml >>> 0, false);
  dv.setUint32(padded.length - 8, Math.floor(ml / 0x100000000), false);

  let h0=0x67452301,h1=0xefcdab89,h2=0x98badcfe,h3=0x10325476,h4=0xc3d2e1f0;
  const w = new Int32Array(80);
  for(let off=0; off<padded.length; off+=64){
    for(let i=0;i<16;i++) w[i] = dv.getInt32(off + i*4, false);
    for(let i=16;i<80;i++){ const n = w[i-3]^w[i-8]^w[i-14]^w[i-16]; w[i] = (n<<1)|(n>>>31); }
    let a=h0,b=h1,c=h2,d=h3,e=h4;
    for(let i=0;i<80;i++){
      let f,k;
      if(i<20){ f=(b&c)|(~b&d); k=K[0]; }
      else if(i<40){ f=b^c^d; k=K[1]; }
      else if(i<60){ f=(b&c)|(b&d)|(c&d); k=K[2]; }
      else { f=b^c^d; k=K[3]; }
      const t = (((a<<5)|(a>>>27)) + f + e + k + w[i]) >>> 0;
      e=d; d=c; c=(b<<30)|(b>>>2); b=a; a=t;
    }
    h0=(h0+a)>>>0; h1=(h1+b)>>>0; h2=(h2+c)>>>0; h3=(h3+d)>>>0; h4=(h4+e)>>>0;
  }
  return [h0,h1,h2,h3,h4].map(x=>x.toString(16).padStart(8,'0')).join('');
}
/** git 对象格式：blob <字节数>\0<内容>，再做 SHA-1 */
function gitBlobSha1(bytes){
  const content = new Uint8Array(bytes);
  const header = enc.encode('blob ' + content.length + '\u0000');
  const buf = new Uint8Array(header.length + content.length);
  buf.set(header, 0); buf.set(content, header.length);
  return sha1Hex(buf);
}

/* =========================================================================
   3. 全局进度：所有任务共用一条
   ========================================================================= */
const progState = { base: 0, span: 100, text: '' };
function progStart(text, base = 0, span = 100){
  const p = $('prog1'); if(!p) return;
  p.classList.remove('off'); p.classList.remove('done'); p.classList.remove('err');
  progState.base = base; progState.span = span; progState.text = text;
  progSet(0, text);
}
function progSet(pct, text){
  const p = $('prog1'); if(!p) return;
  const overall = progState.base + (Math.max(0, Math.min(100, pct)) / 100) * progState.span;
  const bar = $('progBar'), pc = $('progPct'), txt = $('progTxt');
  if(bar) bar.style.width = overall.toFixed(1) + '%';
  if(pc) pc.textContent = Math.round(overall) + '%';
  if(txt && text != null) txt.innerHTML = String(text);
  if(txt && text == null && progState.text) txt.innerHTML = progState.text;
}
function progText(text){ progState.text = String(text); progSet(null, progState.text); }
function progIdle(text){ progState.base = 0; progState.span = 100; progEnd(text || '空闲', true); }
function progEnd(text, ok = true){
  const p = $('prog1'); if(!p) return;
  const bar = $('progBar'), pc = $('progPct'), txt = $('progTxt');
  if(bar) bar.style.width = '100%';
  if(pc) pc.textContent = ok ? '100%' : (pc.textContent || '0%');
  if(txt) txt.innerHTML = text || (ok ? '完成' : '已中断');
  p.classList.add(ok ? 'done' : 'err');
  clearTimeout(progState._t);
  progState._t = setTimeout(() => {
    p.classList.add('off');
    const t = $('progTxt'); if(t) t.textContent = '空闲';
    const pc2 = $('progPct'); if(pc2) pc2.textContent = '0%';
    const b2 = $('progBar'); if(b2) b2.style.width = '0%';
  }, ok ? 1400 : 4000);
}

/* =========================================================================
   4. 日志
   ========================================================================= */
let logEmpty = true;
function log(msg, cls){
  const el = $('log'); if(!el) return;
  if(logEmpty){ el.textContent = ''; logEmpty = false; }
  const line = document.createElement('div');
  if(cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  while(el.children.length > 500) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

/* =========================================================================
   5. HTML → Markdown 转换
   ========================================================================= */
const INLINE_TAG = /^(SPAN|EM|I|B|STRONG|SMALL|CITE|Q|DFN|U|SUB|SUP|MARK|ABBR|VAR|KBD|SAMP|CODE|LABEL|BDI|BDO|WBR)$/;
let cssRules = new Map();
const _styleCache = new WeakMap();

/** 从文档的 <style> 采集类名 → 样式声明。
 *  必须自己解析：EPUB 章节由 DOMParser 生成，不属于当前窗口，
 *  getComputedStyle 对它返回空值（实测 fontStyle 为空）。 */
function collectCssRules(doc){
  cssRules = new Map();
  if(!doc || !doc.querySelectorAll) return;
  const RE = /(font-style|font-weight|font-size|text-decoration)\s*:\s*([^;}]+)/gi;
  const RULES = /([^{}]+)\{([^{}]*)\}/g;
  for(const st of doc.querySelectorAll('style')){
    const css = st.textContent || '';
    let r;
    while((r = RULES.exec(css))){
      const props = [];
      let m;
      RE.lastIndex = 0;
      while((m = RE.exec(r[2]))) props.push(m[1].toLowerCase() + ':' + m[2].trim());
      if(!props.length) continue;
      const decl = props.join(';');
      for(const part of String(r[1]).split(',')){
        const name = part.trim().replace(/^\./, '');
        if(!name || name.includes(' ') || name.includes(':')) continue;
        cssRules.set(name.toLowerCase(), decl);
      }
    }
  }
}

/** 取元素样式：内联 > CSS 类规则 > computed */
function computedOf(el){
  if(_styleCache.has(el)) return _styleCache.get(el);
  let st = (el.getAttribute && el.getAttribute('style')) || '';
  if(!/font-?(style|weight|size)|text-decoration/i.test(st)){
    const cls = (el.getAttribute('class') || '').split(/\s+/).filter(Boolean);
    for(const c of cls){
      const rule = cssRules.get(c.toLowerCase());
      if(rule){ st = st ? st + ';' + rule : rule; break; }
    }
  }
  if(!st){
    try{
      const view = el.ownerDocument && el.ownerDocument.defaultView;
      if(view && view.getComputedStyle){
        const cs = view.getComputedStyle(el);
        st = [cs.fontSize, cs.fontWeight, cs.fontStyle].filter(Boolean).join(';');
      }
    }catch(e){}
  }
  _styleCache.set(el, st);
  return st;
}

/** 页眉页脚等噪声：按完整 class/id 名精确匹配，避免 bookmark 误伤 bookmark-list */
const NOISE_RE = /^(?:page-?header|page-?footer|pagehead|pagefoot|running-?head|running-?foot|running-?title|chapter-?marker|decorative?|separator|divider)$/i;
function isNoise(el){
  if(!el || el.nodeType !== 1) return false;
  const rawCls = el.getAttribute('class') || '';
  const rawId = el.getAttribute('id') || '';
  const tokens = (rawCls + ' ' + rawId).split(/[\s_-]+/).filter(Boolean);
  if(tokens.some(t => NOISE_RE.test(t))) return true;
  if(NOISE_RE.test(rawCls.trim()) || NOISE_RE.test(rawId.trim())) return true;
  const t = el.getAttribute('epub:type') || '';
  // noteref/biblioref/pagebreak 是导航标记要剔除；footnote/endnote 是注释正文，必须保留
  if(/^(noteref|biblioref|pagebreak|page-list|landmarks|toc)$/i.test(t)) return true;
  return false;
}

/** 字号解析（pt/px 粗略统一到 px 量级） */
function pxSize(st){
  const m = /font-?size\s*[:=]\s*([\d.]+)\s*(px|pt|em|rem|%)?/i.exec(st || '');
  if(!m) return null;
  const v = parseFloat(m[1]);
  if(isNaN(v)) return null;
  const u = (m[2] || 'px').toLowerCase();
  if(u === 'pt') return v * 1.333;
  if(u === 'em' || u === 'rem') return v * 16;
  if(u === '%')  return v / 100 * 16;
  return v;
}

/** 该加粗是否为排版噪音而非语义强调 */
function isLayoutBold(el){
  const tag = (el.tagName || '').toUpperCase();
  const semantic = (tag === 'STRONG' || tag === 'B');
  const styledBold = /font-weight\s*:\s*(bold|bolder|[6-9]00)/i.test(computedOf(el));
  if(!semantic && !styledBold) return false;
  const BLOCK = /^(P|DIV|LI|TD|TH|H1|H2|H3|H4|H5|H6|BLOCKQUOTE|SECTION|ARTICLE|DD|DT|TR|TABLE)$/;
  if(BLOCK.test(tag)) return true;
  const text = (el.textContent || '').trim();
  if(text.length > 8) return true;
  if(/[，。！？；：、,.;!?]/.test(text)) return true;
  if(!semantic && text.length > 6) return true;
  return false;
}

/** 该斜体是否为排版噪音 */
function isLayoutItalic(el){
  const tag = (el.tagName || '').toUpperCase();
  const semantic = (tag === 'EM' || tag === 'I');
  const styledItalic = /font-style\s*:\s*italic/i.test(computedOf(el));
  if(!semantic && !styledItalic) return false;
  const BLOCK = /^(P|DIV|LI|TD|TH|H1|H2|H3|H4|H5|H6|BLOCKQUOTE|SECTION|ARTICLE|DD|DT|TR|TABLE)$/;
  if(BLOCK.test(tag)) return true;
  return (el.textContent || '').trim().length > 8;
}

/** 块级元素是否整体是标题/强调样式（仅单子节点场景） */
function isStyledEmphasis(el){
  if(!el || el.nodeType !== 1) return false;
  const st = computedOf(el);
  return /font-weight\s*:\s*(bold|bolder|[6-9]00)|font-style\s*:\s*italic/i.test(st);
}

const isCJK = ch => !!ch && /[一-龥]/.test(ch);
const isCJKPunct = ch => !!ch && /[　-〿＀-￯]/.test(ch);

/** 两个片段首尾是同一种强调标记时，抹平接缝（`**徐**`+`**浩**` → `**徐浩**`）。
 *  拼不上、或者抹完会留下空壳/三星号，就返回 null 交给调用方原样拼。 */
function mergeSeam(a, b){
  const m1 = /(\*\*|\*|~~)$/.exec(a);
  const m2 = /^(\*\*|\*|~~)/.exec(b);
  if(!m1 || !m2 || m1[1] !== m2[1]) return null;
  const mk = m1[1];
  const left = a.slice(0, a.length - mk.length);
  const right = b.slice(mk.length);
  if(!left.trim() || !right.trim()) return null;
  // 挨着还有一个星号的是 `***` 粗斜体，抹接缝只会把数量搞乱
  if(mk[0] === '*' && (/\*$/.test(left) || /^\*/.test(right))) return null;
  if(mk === '~~' && (/~$/.test(left) || /^~/.test(right))) return null;
  return left + right;
}

/** 拼接相邻内联片段 */
function joinInline(parts, padCjk){
  const P = parts.filter(p => p != null);
  let out = '';
  const stripMark = s => s.replace(/[*_`~]+$/, '');
  const cjkish = ch => isCJK(ch) || isCJKPunct(ch);

  for(let i = 0; i < P.length; i++){
    const p = P[i];
    if(!p) continue;
    if(/^\s+$/.test(p)){
      const trimmed = stripMark(out);
      const prev = trimmed[trimmed.length - 1];
      let j = i + 1;
      while(j < P.length && /^\s+$/.test(P[j] || '')) j++;
      const nextRaw = P[j] || '';
      const nm = /^[*_`~]+/.exec(nextRaw);
      const next = nm ? nextRaw[nm[0].length] : nextRaw[0];
      if(padCjk){ if(prev && !/\s$/.test(out)) out += ' '; continue; }
      if(cjkish(prev) || cjkish(next)) continue;
      if(prev && !/\s$/.test(out)) out += ' ';
      continue;
    }
    if(!out){ out = p; continue; }
    if(/\s$/.test(out) || /^\s/.test(p)){ out += p; continue; }
    /* 接缝合并：`**徐**` + `**浩**` 拼起来是 `**徐****浩**`。
       书名、人名逐字加粗（`<b>徐</b><b>浩</b><b>庆</b>`）时就长这样，
       四个星号挤在一起虽然 cmark 勉强能渲染（套一层多余的 <strong>），
       但既难看又会把自检吓一跳。两段都是同一种标记就直接把接缝抹平。 */
    const seam = mergeSeam(out, p);
    if(seam != null){ out = seam; continue; }
    const trimmed = stripMark(out);
    const prev = trimmed[trimmed.length - 1], first = p[0];
    if(isCJKPunct(prev) || isCJKPunct(first)){ out += p; continue; }
    const leftContent  = /[\w)\]"'`]/.test(prev) || isCJK(prev);
    const rightContent = /[\w(\["'`]/.test(first) || isCJK(first);
    if(leftContent && rightContent){
      const bothCJK = isCJK(prev) && isCJK(first);
      out += (bothCJK ? !!padCjk : true) ? ' ' + p : p;
    }else{
      out += p;
    }
  }
  return out;
}

/** 用标记（** / * / ~~）包住内容，保证标记内侧不留空白。
 *
 * 为什么必须 trim：CommonMark 的强调标记不能贴着空格 ——
 *   `** 绝对优**`、`**绝对优 **`、`**　绝对优**`（全角空格）**都算没闭合**，
 *   GitHub 会把星号原样印在正文里。而 `*绝对优 *` 更糟：星号露出之外，
 *   后面整段还会被吞成斜体。电子书里 `<b>` 内层带换行缩进是常态
 *   （`<b>\n  绝对优</b>` → 内层文本以空格开头），所以这条路一定会踩。
 *
 * 为什么内层带 * 就不套：斜体里嵌斜体会拼出 `*abc**` 这种数量错乱的标记，
 * 远比少一层样式糟。宁可丢样式，不能产出配不上的标记。
 */
function wrapMark(raw, mark){
  const t = String(raw).trim();          // trim 顺带吃掉全角空格 U+3000、&nbsp;
  if(!t) return '';
  if(t.includes(mark[0])) return t;
  return mark + t + mark;
}

function inner(node, ctx, padCjk){
  const parts = [];
  for(const c of node.childNodes){
    if(isNoise(c)) continue;
    parts.push(convNode(c, ctx));
  }
  return joinInline(parts, padCjk);
}

let svgSeq = 0;

function convNode(node, ctx){
  if(node.nodeType === 3){
    /* 全角空格（U+3000）是作者有意的排版分隔，中文标题里极常见（"第一章　绪论"）。
       它会被后面的 \s+ 压成普通空格，再被"中文之间不留空格"的规则吃掉，
       标题就粘成一串（"第一章绪论"）。先换成私有区占位符，清理完再还原。 */
    const KEEP_SP = '\uE000';
    let t = node.nodeValue
      .replace(/\u00a0/g, '')
      .replace(/\u3000/g, KEEP_SP)
      .replace(/([\u3000-〿\uff00-\uffef])[ \t]*\n[ \t]*/g, '$1')
      .replace(/([一-龥])[ \t]*\n[ \t]*(?=[一-龥])/g, '$1')
      .replace(/[ \t]*\n[ \t]*/g, ' ')
      .replace(/\s+/g, ' ');
    t = t.replace(/([\u3000-〿\uff00-\uffef]) +/g, '$1');
    t = t.replace(/([一-龥]) +(?=[一-龥])/g, '$1');
    return t.split(KEEP_SP).join('\u3000');
  }
  if(node.nodeType !== 1) return '';
  const tag = node.tagName.toUpperCase();

  /* 表格单元格里的 <br> 保留成 <br> 标签。
     返回换行的话，外层为了对齐单元格必须把空白压平，换行就被吃成空格，
     "第一行 / 第二行" 会粘成 "第一行第二行"。 */
  if(tag === 'BR') return (ctx && ctx.inTable) ? '<br>' : '\n';
  if(tag === 'HR') return '\n\n---\n\n';
  if(tag === 'IMG'){
    const raw = node.getAttribute('src') || '';
    if(!raw) return '';
    let url = /^data:/i.test(raw) ? raw : (ctx.mapImage ? ctx.mapImage(raw, ctx.currentFile) : raw);
    /* 兜底转义：mapImage 找不到对应文件时会原样返回 src，里面可能带空格或括号。
       空格会截断 Markdown 链接目标、括号会提前闭合。% 一律不动 ——
       已经编码过的路径再编码一次就 404 了。 */
    if(!/^data:/i.test(url)){
      url = String(url).trim().replace(/\s+/g, '%20').replace(/\(/g, '%28').replace(/\)/g, '%29');
    }
    // alt 里的方括号会破坏 ![alt] 语法，竖线会把表格单元格切断
    const alt = (node.getAttribute('alt') || '').replace(/[\[\]|]/g, ' ').replace(/\s+/g, ' ').trim();
    return `![${alt}](${url})`;
  }
  if(tag === 'SVG'){
    let xml = '';
    try{
      const view = node.ownerDocument && node.ownerDocument.defaultView;
      const S = (view && view.XMLSerializer) || (typeof XMLSerializer !== 'undefined' ? XMLSerializer : null);
      if(S) xml = new S().serializeToString(node);
    }catch(e){ xml = ''; }
    if(!xml) return '';
    const bytes = enc.encode('<?xml version="1.0" encoding="UTF-8"?>\n' + xml);
    const fname = ctx && ctx.storeAsset ? ctx.storeAsset('inline-' + (svgSeq++) + '.svg', bytes) : null;
    return fname ? `![${node.getAttribute('aria-label') || '矢量图'}](images/${fname})` : '';
  }
  /* 代码块：围栏必须比内容里最长的一段反引号还要长。
     固定写三个反引号的话，内容里出现 ``` 就会提前把围栏闭合 ——
     后面整段正文被当成代码，末尾还多出两个空壳围栏。
     讲 Markdown / 编程的书里这种内容很常见（书里示范代码块怎么写），
     而一旦发生，GitHub 上看到的是半本书变成灰色代码块。 */
  if(tag === 'PRE'){
    const txt = node.textContent.replace(/\n+$/, '');
    if(!txt.trim()) return '';
    /* 语言名优先取 <code class="language-xx">，其次看 <pre> 自己。
       带上这个标注 GitHub 才做语法高亮，书里的示例代码会好看很多。 */
    const codeEl = node.querySelector('code');
    const cls = ((codeEl && codeEl.getAttribute('class')) || '') + ' ' + (node.getAttribute('class') || '');
    const lm = /(?:^|[\s"'])(?:language-|lang-|highlight-)([a-z0-9+#._-]+)/i.exec(cls);
    const lang = lm ? lm[1].toLowerCase() : '';
    const runs = txt.match(/`{3,}/g) || [];
    const maxRun = runs.reduce((a, b) => Math.max(a, b.length), 0);
    const fence = '`'.repeat(Math.max(3, maxRun + 1));
    return '\n\n' + fence + lang + '\n' + txt + '\n' + fence + '\n\n';
  }
  if(tag === 'CODE' && node.parentElement && node.parentElement.tagName.toUpperCase() !== 'PRE'){
    const txt = node.textContent;
    const runs = txt.match(/`+/g) || [];
    const maxRun = runs.reduce((a, b) => Math.max(a, b.length), 0);
    const fence = '`'.repeat(maxRun + 1);
    const pad = txt.startsWith('`') || txt.endsWith('`') ? ' ' : '';
    return fence + pad + txt + pad + fence;
  }
  if(tag === 'SUB') return '<sub>' + inner(node, ctx) + '</sub>';
  if(tag === 'SUP') return '<sup>' + inner(node, ctx) + '</sup>';
  if(tag === 'RUBY'){
    let base = '', reading = '';
    for(const c of node.childNodes){
      const isRt = (c.tagName || '').toUpperCase() === 'RT';
      const t = convNode(c, ctx);
      if(isRt) reading += t; else base += t;
    }
    return reading ? base + '（' + reading + '）' : base;
  }
  if(/^H[1-6]$/.test(tag)){
    /* 这里不能用 \s —— JS 的 \s 包含 U+3000，会把"第一章　绪论"里的全角空格压成半角。 */
    const t = inner(node, ctx, true).replace(/[ \t\r\n\f\v]+/g, ' ').trim();
    return t ? `\n\n${'#'.repeat(+tag[1])} ${t}\n\n` : '';
  }
  if(tag === 'STRONG' || tag === 'B'){
    const t = inner(node, ctx);
    if(!t.trim()) return '';
    return isLayoutBold(node) ? t : wrapMark(t, '**');
  }
  if(tag === 'DEL' || tag === 'S' || tag === 'STRIKE'){
    const t = inner(node, ctx);
    return wrapMark(t, '~~');
  }
  if(tag === 'EM' || tag === 'I'){
    const t = inner(node, ctx);
    if(!t.trim()) return '';
    return isLayoutItalic(node) ? t : wrapMark(t, '*');
  }
  if(tag === 'A'){
    const href = node.getAttribute('href') || '';
    const text = inner(node, ctx).trim() || href;
    if(!href || /^\s*javascript:/i.test(href)) return text;
    if(/^#/.test(href)) return text;
    const url = href.trim().replace(/\s+/g, '%20').replace(/\(/g, '%28').replace(/\)/g, '%29');
    return `[${text.replace(/[\[\]]/g,'')}](${url})`;
  }
  if(tag === 'BLOCKQUOTE'){
    const t = cleanupMd(inner(node, ctx)).trim();
    if(!t) return '';
    const quoted = t.split('\n').map(l => l.trim() ? '> ' + l : '>').join('\n').trim();
    return '\n\n' + quoted + '\n\n';
  }
  if(tag === 'UL' || tag === 'OL'){
    const ordered = tag === 'OL';
    const items = [...node.children].filter(c => c.tagName.toUpperCase() === 'LI');
    const lines = [];
    const markerW = ordered ? String(items.length).length + 2 : 2;
    const contPad = ' '.repeat(Math.max(3, markerW));
    items.forEach((li, idx) => {
      /* 嵌套列表前的空行会让整个 li 被包进 <p>，GFM 渲染成"松散列表"
         （每项之间一大段空隙）。只压掉紧挨着列表标记的空行，多段落间距保留。 */
      let t = inner(li, ctx).trim()
        .replace(/\n{2,}$/, '')
        .replace(/\n{2,}(?=\s*(?:[-*+]|\d+\.)\s)/g, '\n');
      const marker = ordered ? `${idx + 1}. ` : '- ';
      lines.push(t.split('\n').map((l, i) => i === 0 ? marker + l : contPad + l).join('\n'));
    });
    return '\n\n' + lines.join('\n') + '\n\n';
  }
  if(tag === 'TABLE') return '\n\n' + convTable(node, ctx) + '\n\n';
  if(tag === 'FIGCAPTION' || (node.getAttribute('class') || '').match(/caption/i)){
    const t = inlineText(node);
    return t ? '\n\n' + wrapMark(t, '*') + '\n\n' : '';
  }
  if(tag === 'P' || tag === 'SECTION' || tag === 'ARTICLE' || tag === 'DIV' || tag === 'ASIDE' || tag === 'DD' || tag === 'DT'){
    const t = inner(node, ctx);
    return t.trim() ? '\n\n' + t.trim() + '\n\n' : '';
  }
  // SPAN 之类的行内元素：如果 CSS 类/内联样式表明它有强调或斜体，
  // 也要转成对应的 Markdown 标记 —— 电子书常用 <span class="em"> 表达斜体。
  if(INLINE_TAG.test(tag) && !['EM','I','B','STRONG','CODE','SUB','SUP','RUBY'].includes(tag)){
    const st = computedOf(node);
    /* 必须用 trim 过的内容包标记：
       结尾带空格的 `*abc *` 在 CommonMark 里**不算闭合**（强调不能以空格结尾），
       于是这一行之后的内容全被吞成斜体，星号还可能原样露出来。 */
    const t = inner(node, ctx).trim();
    if(!t) return '';
    // 样式里明确是斜体/粗体（且不是"整段加粗"那种排版噪音）才加标记
    const italic  = /font-style\s*:\s*italic/i.test(st);
    const bold    = /font-weight\s*:\s*(bold|bolder|[6-9]00)/i.test(st);
    if(italic && !bold && !isLayoutItalic(node)) return wrapMark(t, '*');
    if(bold && !italic && !isLayoutBold(node)) return wrapMark(t, '**');
    return t;
  }
  if(INLINE_TAG.test(tag)) return inner(node, ctx);
  return inner(node, ctx);
}

/** 取纯文本（去掉强调标记），用于图题/表题 */
function inlineText(node){
  let t = '';
  for(const c of node.childNodes) t += convNode(c, { currentFile:'', mapImage:null });
  return t.replace(/\*\*/g,'').replace(/[*_`~]/g,'').replace(/\s+/g,' ').trim();
}

function convTable(table, ctx){
  const cap = table.querySelector('caption');
  let capLine = '';
  if(cap){
    const ct = cleanupMd(inner(cap, ctx)).trim().replace(/\n+/g,' ');
    if(ct) capLine = `\n\n*${ct}*\n\n`;
  }
  const rows = [...table.querySelectorAll('tr')];
  if(!rows.length) return capLine.trim();
  /* 进单元格时打上标记，让 <br> 保留成标签而不是换行（见 convNode 的 BR 分支）。
     用完必须还原 —— 表格单元格里再嵌表格时，外层标记不能漏进内层之外的作用域。 */
  const cellText = tr => {
    const prev = ctx ? ctx.inTable : false;
    if(ctx) ctx.inTable = true;
    try{
      return [...tr.children]
        .filter(td => ['TD','TH'].includes(td.tagName.toUpperCase()))
        .map(td => inner(td, ctx)
          .replace(/\s*\n+\s*/g, '<br>')   // 源码折行的兜底：也并成 <br>
          .replace(/\s+/g, ' ')
          .replace(/\|/g, '\\|')
          .trim());
    }finally{ if(ctx) ctx.inTable = prev; }
  };
  // 表头只认第一行，避免数据行里的 th 被误升为表头
  const headRow = rows[0];
  const head = cellText(headRow);
  const body = rows.filter(r => r !== headRow).map(cellText);
  if(!head.length) return capLine.trim();
  /* 列数按整张表最宽的一行算。源表里"表头 3 列、某行 4 列"很常见，
     按表头截断会把多出来的单元格直接丢掉（数据无声消失）。 */
  const cols = Math.max(head.length, ...body.map(r => r.length));
  const norm = cells => { const c = cells.slice(0, cols); while(c.length < cols) c.push(''); return c; };
  let s = '| ' + norm(head).join(' | ') + ' |\n';
  s += '| ' + Array.from({length: cols}, () => '---').join(' | ') + ' |\n';
  for(const r of body) s += '| ' + norm(r).join(' | ') + ' |\n';
  return (capLine + '\n' + s).trim();
}

/** 把「标记内侧带空白」的写法挪到外面 —— 这类写法在 CommonMark 里不闭合。
 *
 *  `**绝对优 **势` 和 `** 绝对优**势` 在 GitHub 上都不是粗体，星号原样印出来；
 *  `*绝对优 *` 还会把后面整段吞成斜体。而我们的正则预览认这两种写法，
 *  于是出现「本地看是粗体、GitHub 上是星号」的分裂现象。
 *  生成器已经保证不再产出（见 wrapMark），这一层兜的是**原文自带**的星号
 *  （书里用 `**xx**` 当强调标记的情况）和历史 md。
 */
/** 只处理行内代码（反引号跨度）之外的部分。
 *  `` `**a  **` `` 里的空格、`**徐****浩**` 这种示范字符串都是**内容**，
 *  动了它就把书里的示例改坏了。 */
function mapOutsideCode(line, fn){
  let out = '', last = 0, m;
  const re = /(`+)([\s\S]*?)\1/g;
  while((m = re.exec(line))){
    out += fn(line.slice(last, m.index)) + m[0];
    last = m.index + m[0].length;
  }
  return out + fn(line.slice(last));
}

/** 标出每一行是否落在代码围栏里。
 *
 *  结束行的判定必须是"整行只有反引号"，且长度 ≥ 开始行 —— 这是 CommonMark 的规矩。
 *  拿 /^\s*```/ 一把抓（看到三个反引号就翻转状态）的话，
 *  代码块内容里的 ```python 会被当成结束标记，状态从那一行起全反：
 *  后面的正文整个掉进代码块，末尾还多出两个空壳围栏。
 */
function fenceMask(lines){
  const mask = new Array(lines.length).fill(false);
  let inF = false, len = 0;
  for(let i = 0; i < lines.length; i++){
    const line = lines[i];
    if(inF){
      mask[i] = true;
      const m = /^\s*(`{3,})\s*$/.exec(line);
      if(m && m[1].length >= len){ inF = false; len = 0; }
      continue;
    }
    const open = /^\s*(`{3,})/.exec(line);
    if(open){ inF = true; len = open[1].length; mask[i] = true; continue; }
  }
  return mask;
}

function fixEmphasisSpacing(md){
  const lines = String(md).split('\n');
  const mask = fenceMask(lines);
  return lines.map((line, i) => {
    if(mask[i]) return line;      // 围栏行（含起止）原样放过
    if(/^\s*([*\-_])\s*(?:\1\s*){2,}$/.test(line)) return line;   // 分隔线 * * *
    return mapOutsideCode(line, seg => {
      let out = seg.replace(/(\*\*|~~)([^\n]*?)\1/g, (m, mark, body) => {
        const t = body.trim();
        if(!t || t === body) return m;
        const lead  = (body.match(/^[ \t\u3000]+/) || [''])[0];
        const trail = (body.match(/[ \t\u3000]+$/) || [''])[0];
        return lead + mark + t + mark + trail;
      });
      /* 相邻粗体接缝：`**徐****浩****庆**`（人名逐字加粗）→ `**徐浩庆**`。
         cmark 勉强能渲染，但会套出一串多余的 <strong>，自检也会报"可能露星号"。 */
      for(let k = 0; k < 5; k++){
        const next = out.replace(/\*\*([^*\n]+?)\*\*\*\*([^*\n]+?)\*\*/g, '**$1$2**');
        if(next === out) break;
        out = next;
      }
      return out;
    });
  }).join('\n');
}

/** 清理多余空白。代码围栏内完全原样保留 ——
 *  里面的缩进、空行、# 注释都是代码的一部分，不能做全局正则。 */
function cleanupMd(s){
  const lines = String(s).split('\n');
  /* 代码围栏整块换成**一行占位符**，全局清洗完再原样换回去。
     以前是把围栏块抽出来**追加到文末** —— 于是第 2 章的一段示例代码
     会跑到全书最后，正文顺序全乱，而日志里一点错误都没有。
     占位符是单行文本，空行压缩之类的清洗不会渗进代码块内部。 */
  const blocks = [];
  const out = [];
  let inFence = false, buf = null;
  for(const line of lines){
    if(/^\s*```/.test(line)){
      if(inFence){
        buf.push(line);
        blocks.push(buf.join('\n'));
        out.push('\u0000F' + (blocks.length - 1) + '\u0000');
        buf = null; inFence = false;
      }else{ inFence = true; buf = [line]; }
      continue;
    }
    if(inFence){ buf.push(line); continue; }
    out.push(line.replace(/[ \t　]+$/,'').replace(/^　+/,''));
  }
  // 围栏没闭合（源文件本身残缺）：剩下的按原样留在原位
  if(inFence && buf && buf.length){
    blocks.push(buf.join('\n'));
    out.push('\u0000F' + (blocks.length - 1) + '\u0000');
  }

  let t = out.join('\n')
    .replace(/\n{3,}/g, '\n\n')
    .replace(/\n\s*\n/g, '\n\n')
    .replace(/^> ([^\n]*)\n\n(?=> )/gm, '> $1\n>\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
  t = fixEmphasisSpacing(t);
  if(!blocks.length) return t;
  return t.replace(/\u0000F(\d+)\u0000/g, (m, i) => blocks[+i]);
}

/** 标题层级归一化：按出现顺序取相对深度，避免产出 #### 过深层级 */
function normalizeHeadings(md){
  /* 标题层级重排：用「父级栈」推导深度，不用"出现过的级别列表"做映射。
   *
   * 为什么不能做映射：映射只能保证"不同级别映射到不同目标"，保证不了连续。
   * 书里常见两种脏结构：
   *   ① 章 h2 下面直接 h4（作者跳过了 h3）→ 映射后是 H2 直接 H4，自检报"标题跳级"
   *   ② 拿 h6 当某种小标题用，且出现在 h2 与 h4 之间 → 排序后 h6 占掉一档，
   *      h4 又被推到更深的档，跳级照旧
   * 栈算法天然没有这个问题：每次只比"当前级别比我深的祖先都出栈"，
   * 深度 = 剩下的祖先数 + 1。相邻两级深度最多只差 1，**结构上不可能跳级**。
   *
   * 副作用是 h6 和紧跟着的 h4 可能并成同一档 —— 但它们本来就是兄弟关系
   * （h4 弹出 h6），并档比凭空造一个断层好。
   */
  const lines = md.split('\n');
  const mask = fenceMask(lines);
  const stack = [];          // 当前路径上的原始级别，从浅到深
  return lines.map((line, i) => {
    if(mask[i]) return line;  // 代码围栏里的内容（含 # 注释）不是标题
    const m = line.match(/^(#{1,6})\s+(.*)$/);
    if(!m) return line;
    const lvl = m[1].length;
    while(stack.length && stack[stack.length - 1] >= lvl) stack.pop();
    stack.push(lvl);
    // +1 是因为 H1 留给书名，正文从 H2 起；最多到 H6
    const depth = Math.min(6, stack.length + 1);
    return '#'.repeat(depth) + ' ' + m[2];
  }).join('\n');
}

function htmlToMarkdown(html, ctx){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  collectCssRules(doc);
  for(const bad of doc.querySelectorAll('script,style,noscript,head')) bad.remove();
  for(const el of [...doc.querySelectorAll('*')]) if(isNoise(el)) el.remove();
  const body = doc.body || doc.documentElement;
  return cleanupMd(inner(body, ctx));
}

/* =========================================================================
   6. 自检：转换完自动判断，用户不用肉眼检查
   ========================================================================= */
function mdRefs(md){
  const refs = [];
  for(const m of String(md).matchAll(/!?\[[^\]]*\]\(\s*([^)\s]+)[^)]*\)/g)) refs.push(safeDecode(m[1]));
  return refs;
}
function imageNameSet(images){
  const set = new Set();
  if(!images) return set;
  if(images instanceof Map){ for(const k of images.keys()) set.add(k); return set; }
  for(const it of images){ if(Array.isArray(it)) set.add(it[0]); else if(typeof it === 'string') set.add(it); }
  return set;
}
function inlineCodeBalanced(md){
  const noFence = String(md).replace(/^\s*```[\s\S]*?^\s*```/gm, '');
  let depth = 0;
  for(const m of noFence.matchAll(/`+/g)){
    const n = m[0].length;
    if(depth === 0) depth = n;
    else if(depth === n) depth = 0;
  }
  return depth === 0;
}

/** 把「不可能是标记的星号」抹掉，并列出真正的星号行程。
 *  代码围栏、HTML 标签、行内代码、反斜杠转义、链接目标里的星号都不能算标记。
 *  抹成等长空格而不是删掉，并且**逐行拼回去要保留换行** ——
 *  换行丢了，报错的行号会永远指向第 1 行（第一行是书名，看着莫名其妙）。 */
function starScan(md){
  const lines = String(md).split('\n');
  let inFence = false, clean = '';
  for(const raw of lines){
    let l = raw;
    const blank = () => l.replace(/[^\n]/g, ' ');
    if(/^\s*```/.test(l)){ inFence = !inFence; clean += blank() + '\n'; continue; }
    if(inFence){ clean += blank() + '\n'; continue; }
    /* 分隔线（`* * *` / `***` / `> ***` / `- ***`）里的星号不是强调标记。
       注意只用 [ \t]：U+3000 不算 —— 写成 `****　` 的行在 CommonMark 里
       不是分隔线，星号会原样显示。 */
    if(/^[ \t]*(?:>[ \t]*)*(?:(?:[-*+]|\d+[.)])[ \t]+)?([*\-_])(?:[ \t]*\1){2,}[ \t]*$/.test(l)){ clean += blank() + '\n'; continue; }
    l = l.replace(/<\/?[a-zA-Z][^>]*>/g, m => ' '.repeat(m.length));              // HTML 标签
    l = l.replace(/(`+)([\s\S]*?)\1/g, m => ' '.repeat(m.length));               // 行内代码
    l = l.replace(/\\[\\`*_{}[\]()#+\-.!~|>]/g, m => ' '.repeat(m.length));        // 转义
    l = l.replace(/\]\([^)]*\)/g, m => ' '.repeat(m.length));                     // 链接目标
    clean += l + '\n';
  }
  const runs = [];
  const re = /\*+/g;
  let m;
  while((m = re.exec(clean))) runs.push({ at: m.index, n: m[0].length });
  return { lines, clean, runs };
}

const starLine = (clean, at) => clean.slice(0, at).split('\n').length;
function starSnip(lines, line){
  const raw = lines[line - 1] || '';
  return (raw.length > 40 ? raw.slice(0, 40) + '…' : raw).trim();
}

/** 按 CommonMark 的方向规则给星号配对，返回「开了没闭上」的那些。
 *
 *  够用的方向规则：
 *    能开 = 右边不是空白    —— 强调不能以空格开头
 *    能闭 = 左边不是空白    —— 强调不能以空格结尾
 *
 *  漏掉的关键就在这里：老扫描器只问「有没有成对的 **」，没问「这对 ** 内侧
 *  是不是贴着空格」。`** 绝对优**` 和 `**绝对优 **` 在 GitHub 上都不算闭合，
 *  星号会原样印进正文 —— 用户看到的 `**绝对优**势` 就是这么来的。
 *  这种写法左右两个标记都在，任何"数个数"的检查都查不出来。
 *
 *  两条克制规则，避免把书里**本来就有的**星号当成 bug：
 *   ① 左右两边都是空白的星号（如「直接写 ** 而不加空格」）是字面 token，不参与配对；
 *   ② 只报「开了没闭上」。能闭但没得闭的（如 `2**  y`）也放行 ——
 *      那是原文里的字面星号，报出来只会制造噪音。
 */
function pairStars(clean, runs, opt){
  const isWS = c => c === undefined || /\s/.test(c);
  const isAlnum = c => !!c && /[0-9A-Za-z]/.test(c);
  /* 给每个行程标上行号（行程本身就是升序的，一次扫完即可）。*/
  const lineOf = [];
  let ln = 1, pos = 0;
  for(const r of runs){ for(let i = pos; i < r.at; i++) if(clean[i] === '\n') ln++; lineOf.push(ln); pos = r.at; }
  const perLine = {};
  runs.forEach((r, i) => { if(r.n >= opt.min && (!opt.max || r.n <= opt.max)) perLine[lineOf[i]] = (perLine[lineOf[i]] || 0) + 1; });

  const open = [];
  let closeNoOpen = null;
  const unit = opt.unit || 2;   // 粗体一次吃 2 个星号，斜体吃 1 个
  runs.forEach((r, i) => {
    if(r.n < opt.min || (opt.max && r.n > opt.max)) return;
    const prev = clean[r.at - 1], next = clean[r.at + r.n];
    if(opt.guardAlnum && r.n === 1 && isAlnum(prev) && isAlnum(next)) return;    // 5*3、a*b
    /* 单打独斗的一个星号行程，两边还都是空白 —— 那是正文里的字面 token
       （"直接写 ** 而不加空格"），不是标记。整行只有它一个的也放行：
       `x  **2`、`2**  y` 这种是公式，报出来纯属噪音。 */
    if(isWS(prev) && isWS(next)) return;
    if(opt.lineAware && perLine[lineOf[i]] < 2) return;
    /* 一个行程里的星号可以拆开用：`**徐****浩**` 中间那 4 个星号，
       前两个当闭、后两个当开，是合法的嵌套粗体（cmark 能渲染）。
       所以按 unit 记账，而不是"一个行程一次配对"。 */
    let rem = r.n;
    if(!isWS(prev) && open.length && rem >= unit){ open.pop(); rem -= unit; }      // 先当闭标记用
    if(rem >= unit && !isWS(next)){ open.push(r); rem -= unit; }                  // 剩下的当开标记
    else if(rem >= unit && rem === r.n && !isWS(prev) && !closeNoOpen) closeNoOpen = r;   // 想闭却没得闭
  });
  return { open, closeNoOpen };
}

/** 粗体 `**` 会不会在 GitHub 上原样露出来 */
function scanBold(md){
  const { lines, clean, runs } = starScan(md);
  const r = pairStars(clean, runs, { min: 2, lineAware: true, unit: 2 });
  const bad = r.open[0] || r.closeNoOpen;
  if(!bad) return { unmatched: false };
  const line = starLine(clean, bad.at);
  return { unmatched: true, line, snippet: starSnip(lines, line) };
}

/** 斜体 `*`（单星号）会不会在 GitHub 上原样露出来。
 *
 *  scanBold 只管 `**`，单星号一直是盲区 —— 而单个 `*` 失配的后果更显眼：
 *  GitHub 会把后面一大段都变成斜体，星号还照原样露着。
 *  用户看到过的 `**降低…模**式`、`*用数据说话` 都属于这一类。
 */
function scanItalic(md){
  const { lines, clean, runs } = starScan(md);
  const r = pairStars(clean, runs, { min: 1, max: 1, guardAlnum: true, unit: 1 });
  const bad = r.open[0];
  if(!bad) return { unmatched: false };
  const line = starLine(clean, bad.at);
  return { unmatched: true, line, snippet: starSnip(lines, line) };
}

function validateMarkdown(md, imageNames){
  const issues = [];
  const push = (level, msg) => issues.push({ level, msg });
  if(!md || !md.trim()){ push('err','输出为空'); return { ok:false, issues, errorCount:1, warnCount:0 }; }

  const boldScan = scanBold(md);
  if(boldScan.unmatched) push('err',
    `第 ${boldScan.line} 行的 ** 在 GitHub 上不会生效，星号会原样印进正文` +
    `（CommonMark 规定标记内侧不能贴空格、且必须成对）。去那一行把星号内侧的空格删掉：${boldScan.snippet}`);

  const italScan = scanItalic(md);
  if(italScan.unmatched) push('err',
    `正文有未闭合的斜体标记 *（第 ${italScan.line} 行）：GitHub 上会把后面一大段都变成斜体，星号还可能原样露出来。` +
    `去那一行把落单的 * 删掉或补全：${italScan.snippet}`);

  const fences = (md.match(/^\s*```/gm) || []).length;
  if(fences % 2 !== 0) push('err', `代码围栏数量为奇数（${fences}），存在未闭合的代码块`);
  if(!inlineCodeBalanced(md)) push('warn','有未闭合的行内代码，建议检查含反引号的正文');

  for(const tag of ['sub','sup']){
    const o = (md.match(new RegExp('<'+tag+'>','g'))||[]).length;
    const c = (md.match(new RegExp('</'+tag+'>','g'))||[]).length;
    if(o !== c) push('warn', `<${tag}> 标签不成对（${o} 开 / ${c} 闭）`);
  }

  const lines = md.split('\n');
  /* 表格按「连续以 | 开头的行」分块。整篇一起比会误报 ——
     一本书里 2 列的表和 4 列的表同时存在是正常的，只有同一张表内部列数不齐才错位。 */
  const tableBlocks = [];
  let curTable = [];
  for(const l of lines){
    if(/^\s*\|/.test(l)) curTable.push(l);
    else if(curTable.length){ tableBlocks.push(curTable); curTable = []; }
  }
  if(curTable.length) tableBlocks.push(curTable);
  if(tableBlocks.length){
    const isSep = l => /^\s*\|[\s:|-]+\|\s*$/.test(l);
    tableBlocks.forEach((rows, bi) => {
      const tag = tableBlocks.length > 1 ? `第 ${bi + 1} 个表格` : '表格';
      if(!rows.some(isSep)) push('warn', `${tag}缺少表头分隔行，不会被渲染成表格`);
      const cols = rows.filter(l => !isSep(l)).map(l => l.replace(/\\\|/g,'\u0001').split('|').length);
      const uniq = [...new Set(cols)];
      if(uniq.length > 1) push('warn', `${tag}各行列数不一致（${uniq.join(' / ')}），会渲染错位`);
    });
  }

  /* 代码围栏里的 `# 注释` 不是标题。
     以前只判断"这一行是不是围栏行"就跳过，却没有维护围栏状态，
     于是围栏内部照旧被当正文扫 —— 讲编程的书里满屏 # 注释，
     自检面板就会报一堆莫须有的"标题跳级"。 */
  const mask = fenceMask(lines);
  const hs = [];
  lines.forEach((l, i) => {
    if(mask[i]) return;
    const m = l.match(/^(#{1,7})\s+(.+)$/);
    if(m) hs.push({ level: m[1].length, text: m[2], line: i+1 });
  });
  for(let i = 1; i < hs.length; i++){
    if(hs[i].level - hs[i-1].level > 1){
      push('warn', `标题跳级：第 ${hs[i-1].line} 行 H${hs[i-1].level} 之后，第 ${hs[i].line} 行直接是 H${hs[i].level}（${hs[i].text.slice(0,14)}）`);
      break;
    }
  }
  hs.filter(h => h.level > 6).forEach(h => push('err', `第 ${h.line} 行用了 H${h.level}，超过 Markdown 上限 H6`));

  const outside = md.replace(/^\s*```[\s\S]*?^\s*```/gm, '');
  const suspicious = outside.split('\n').filter(l => {
    const t = l.replace(/^#+\s*/, '');
    return /^#\s/.test(l) && /^\s*(def |class |import |from |return |print\(|[{};]|\/\/|\/\*|\*\/|#)/.test(t);
  });
  if(suspicious.length) push('err', `代码块内的注释泄漏成了标题：${suspicious[0].slice(0,30)}`);

  if(imageNames && imageNames.size){
    const known = new Set([...imageNames].map(n => 'images/' + n));
    const missing = [...new Set(mdRefs(md))].filter(u => u.startsWith('images/')).filter(u => !known.has(u));
    if(missing.length) push('err', `有 ${missing.length} 张图片找不到对应文件（仓库里会裂图）：${missing.slice(0,3).join('、')}`);
  }

  const errs = issues.filter(i => i.level === 'err');
  return { ok: errs.length === 0, issues, errorCount: errs.length, warnCount: issues.length - errs.length };
}

/* =========================================================================
   7. EPUB 解析（zip + OPF）
   ========================================================================= */
function findEOCD(buf){
  const dv = new DataView(buf);
  for(let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50) return i;
  }
  return -1;
}
function zipEntries(buf){
  const dv = new DataView(buf);
  const eocd = findEOCD(buf);
  if(eocd < 0) throw new Error('不是有效的 EPUB/ZIP（找不到中央目录）');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const out = new Map();
  for(let i = 0; i < count; i++){
    if(off + 46 > buf.byteLength || dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const commentLen = dv.getUint16(off + 32, true);
    const localOff = dv.getUint32(off + 42, true);
    const name = new TextDecoder('utf-8').decode(new Uint8Array(buf, off + 46, nameLen));
    out.set(name, { method, compSize, localOff });
    off += 46 + nameLen + extraLen + commentLen;
  }
  return out;
}

/**
 * ZIP 条目解压。
 *
 * 只用浏览器原生的 DecompressionStream —— 它在 Chrome 80 / Safari 16.4 /
 * Firefox 113（2023 年）之后都可用，覆盖了绝大多数用户。
 *
 * 曾经想手写一份纯 JS inflate 做老浏览器兜底，但实测它无法保证正确性
 * （Huffman 规范序、动态表构造极易出错，而错误的解压会静默产出损坏的图片）。
 * 与其冒数据损坏的风险，不如明确告知用户升级浏览器 —— 这里宁可失败也不给错数据。
 */
async function zipRead(buf, entry){
  if(!entry) return null;
  const dv = new DataView(buf);
  if(dv.getUint32(entry.localOff, true) !== 0x04034b50) throw new Error('ZIP 局部头损坏: ' + entry.name);
  const nameLen = dv.getUint16(entry.localOff + 26, true);
  const extraLen = dv.getUint16(entry.localOff + 28, true);
  const start = entry.localOff + 30 + nameLen + extraLen;
  const bytes = new Uint8Array(buf, start, entry.compSize);
  if(entry.method === 0) return bytes;                     // 存储方式，无需解压
  /* 99 = AES 加密（带 DRM 的 EPUB 走这个）。硬解压出来的字节是乱码，
     后面会变成一堆坏掉的图 —— 与其让人对着"暂不支持的压缩方式 99"发呆，
     不如直说：这是加密的书，换一本没加密的。 */
  if(entry.method === 99)
    throw new Error('这本 EPUB 有 DRM 加密（ZIP method 99），无法解析，请改用未加密的版本');
  if(entry.method !== 8) throw new Error('暂不支持的压缩方式: ' + entry.method);
  if(typeof DecompressionStream !== 'function'){
    throw new Error('当前浏览器版本过低，无法解压 EPUB。请用 Chrome 80+ / Edge 80+ / Safari 16.4+ / Firefox 113+ 打开本页');
  }
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function readText(buf, entry){
  const b = await zipRead(buf, entry);
  if(!b) return null;
  // BOM 与编码探测
  if(b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) return new TextDecoder('utf-8').decode(b.subarray(3));
  if(b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16le').decode(b.subarray(2));
  if(b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16be').decode(b.subarray(2));
  const head = new TextDecoder('utf-8', { fatal:false }).decode(b.subarray(0, 1024));
  const m = /encoding\s*=\s*["']([\w-]+)["']/i.exec(head);
  if(m){
    const encName = m[1].toLowerCase();
    if(encName === 'gbk' || encName === 'gb2312' || encName === 'gb18030'){
      try{ return new TextDecoder('gbk').decode(b); }catch(e){}
    }
    try{ return new TextDecoder(encName).decode(b); }catch(e){}
  }
  return new TextDecoder('utf-8').decode(b);
}
const parseXml = text => new DOMParser().parseFromString(text, 'application/xml');
/**
 * 按 localName 取元素的文本。
 *
 * 必须这么写：OPF 用的是 Dublin Core 命名空间（<dc:title>），而 getElementsByTagName('title')
 * 在 XML 文档里按 **qualifiedName** 匹配，<dc:title> 的 qualifiedName 是 "dc:title"，
 * 于是一个都取不到 —— 之前每本书转换出来的开头都是一个空的 "# "。
 */
function xmlText(doc, tag){
  const want = String(tag).toLowerCase();
  const els = doc.getElementsByTagName('*');
  for(const el of els){
    const ln = (el.localName || el.nodeName || '').toLowerCase();
    if(ln === want) return (el.textContent || '').trim();
  }
  return '';
}

async function epubToMarkdown(arrayBuffer){
  progStart('解析 EPUB…', 0, 100);
  const buf = arrayBuffer;
  const entries = zipEntries(buf);

  // container.xml → OPF 路径。entries 是 key(路径) → entry 对象 的 Map，
  // 注意区分"键名"和"entry 对象"，别把对象当键传回 get()（会取到 undefined）。
  const containerKey = entries.has('META-INF/container.xml')
    ? 'META-INF/container.xml'
    : [...entries.keys()].find(k => k.toLowerCase() === 'meta-inf/container.xml');
  if(!containerKey) throw new Error('缺少 META-INF/container.xml');
  const containerText = await readText(buf, entries.get(containerKey));
  const cdoc = parseXml(containerText);
  const rootfiles = cdoc.getElementsByTagName('rootfile');
  if(!rootfiles.length) throw new Error('container.xml 里没有 rootfile');
  let opfPath = (rootfiles[0].getAttribute('full-path') || '').replace(/^\/+/, '');
  if(!opfPath) throw new Error('rootfile 缺少 full-path');
  const opfKey = entries.has(opfPath) ? opfPath
    : [...entries.keys()].find(k => k.toLowerCase() === opfPath.toLowerCase());
  if(!opfKey) throw new Error('找不到 OPF：' + opfPath);

  const opfText = await readText(buf, entries.get(opfKey));
  const opf = parseXml(opfText);
  const baseDir = dirName(opfPath);

  // manifest：id → {href, mediaType, properties}
  const manifest = new Map();
  for(const it of opf.getElementsByTagName('item')){
    const id = it.getAttribute('id');
    let href = it.getAttribute('href') || '';
    /* OPF 的 href 允许带 #fragment（指向 SVG 内部元素），常规做法是截掉。
       但文件名本身带 # 的也不少见（"a#b.png"），直接截会让它在 manifest 里消失，
       于是正文引用找不到对应条目。先看 zip 里有没有完整路径，没有才截。 */
    try{
      href = safeDecode(href);
      if(!href || !entries.has(normPath(baseDir, href))){
        href = href.split('#')[0].split('?')[0];
      }
    }catch(e){ href = String(href).split('#')[0]; }
    manifest.set(id, {
      abs: normPath(baseDir, href),
      mediaType: (it.getAttribute('media-type') || '').toLowerCase(),
      properties: (it.getAttribute('properties') || '')
    });
  }
  // spine：阅读顺序
  const chapterPaths = [];
  for(const ref of opf.getElementsByTagName('itemref')){
    const it = manifest.get(ref.getAttribute('idref'));
    if(it && /html/.test(it.mediaType || 'html')) chapterPaths.push(it.abs);
  }
  if(!chapterPaths.length){
    // spine 缺失或为空：退回按 manifest 顺序取所有 html
    for(const [, v] of manifest) if(/html/.test(v.mediaType)) chapterPaths.push(v.abs);
  }
  if(!chapterPaths.length) throw new Error('EPUB 里找不到任何章节文件');

  // 图片条目
  const imageEntryByName = new Map();
  let coverItem = null;
  for(const [, v] of manifest){
    if(/^image\//.test(v.mediaType)){
      imageEntryByName.set(v.abs, v);
      if(v.abs.toLowerCase() === coverItem?.abs?.toLowerCase()) continue;
      if(/cover/.test(v.properties)) coverItem = v;
    }
  }
  // meta 里也可能有 cover
  if(!coverItem){
    for(const m of opf.getElementsByTagName('meta')){
      if((m.getAttribute('name') || '').toLowerCase() === 'cover'){
        const it = manifest.get(m.getAttribute('content'));
        if(it) coverItem = it;
      }
    }
  }
  /* 兜底：有些书既没有 properties="cover-image"，也没有 <meta name="cover">，
     但图片就叫 cover.jpg / 封面.png。按约定猜一个，总比整本书没有封面强。 */
  if(!coverItem){
    const guess = [...imageEntryByName.values()].find(v =>
      /(^|\/)(cover|封面|front)[^/]*\.(jpe?g|png|gif|webp|svg)$/i.test(v.abs));
    if(guess) coverItem = guess;
  }

  const images = new Map();
  const usedNames = new Set();
  const usedEntry = new Map();
  // 封面：manifest 里的项只有路径，没有压缩信息，必须回 zip entries 里找真正的 entry
  let coverBytes = null, coverError = '';
  if(coverItem){
    const ck = entries.has(coverItem.abs) ? coverItem.abs
      : [...entries.keys()].find(k => k.toLowerCase() === coverItem.abs.toLowerCase());
    if(!ck){
      coverError = '封面文件不在压缩包里：' + coverItem.abs;
    }else{
      try{
        coverBytes = await zipRead(buf, entries.get(ck));
        if(!coverBytes || !coverBytes.length) coverError = '封面解压出来是空的：' + coverItem.abs;
      }catch(e){
        coverBytes = null;
        coverError = '封面解压失败：' + coverItem.abs + '（' + (e.message || e) + '）';
      }
    }
  }else{
    coverError = '这本 EPUB 没有声明封面';
  }
  // 有封面但读不出来时必须说出来 —— 静默跳过的话，README 里就是一块空白，用户无从判断
  if(coverError) log('  [封面] ' + coverError, /没有声明/.test(coverError) ? 'info' : 'warn');
  else log(`  [封面] ${coverItem.abs}（${fmtSize(coverBytes.length)}）`, 'ok');

  /* 图片文件名净化。
   * EPUB 里的图片名经常带空格、括号、井号、问号、百分号（"my photo 1.jpg"、"figure(2).png"）。
   * 这些字符在 Markdown 链接里是语法的一部分：空格截断目标、括号提前闭合、
   * # 变锚点、% 被二次转义 —— 到 GitHub 上就是一片裂图。
   * 统一换成下划线，中文保留（中文经 URL 编码后完全正常）。 */
  function safeAssetName(name){
    const m = String(name).match(/\.([a-z0-9]+)$/i);
    const ext = m ? '.' + m[1].toLowerCase() : '';
    let base = ext ? String(name).slice(0, -m[0].length) : String(name);
    base = base
      .replace(/[\s\u3000]+/g, '_')
      .replace(/[#?%&+(),;=@!$'"`<>|*\\/:\[\]]/g, '_')
      .replace(/_+/g, '_')
      .replace(/^[_.]+|[_.]+$/g, '')
      .slice(0, 64);
    return (base || 'img') + ext;
  }

  function uniqueName(preferred, ext){
    const clean = safeAssetName(preferred);
    const m = clean.match(/^(.*?)(\.[^.]+)$/);
    const stem = m ? m[1] : clean, sfx = m ? m[2] : '';
    let n = clean, i = 1;
    while(usedNames.has(n)){ n = stem + '_' + (++i) + sfx; }
    usedNames.add(n);
    return n;
  }

  /* 按路径找图片 entry。大小写归一 —— EPUB 里 ../Images/UP.JPG 和 ../images/up.jpg
     常常指向同一个文件，不归一就会给同一张图生成两个名字，其中一个还填不上内容。 */
  function lookupImage(abs){
    if(!abs) return null;
    if(imageEntryByName.has(abs)) return imageEntryByName.get(abs);
    const low = abs.toLowerCase();
    for(const [k, v] of imageEntryByName){ if(k.toLowerCase() === low) return v; }
    return null;
  }

  const ctx = {
    currentFile: '',
    storeAsset(name, bytes){
      const ext = (name.match(/\.[a-z0-9]+$/i) || ['.bin'])[0].toLowerCase();
      const out = uniqueName(baseName(name), ext);
      images.set(out, bytes);
      return out;
    },
    mapImage(src, file){
      if(/^(https?:|data:)/i.test(src)) return src;
      const raw = String(src).trim();
      if(!raw) return src;
      /* 文件名里可能真的带 ? 或 #（zip 路径允许），而这两个字符在 URL 里分别是 query 和
         fragment。先按原样找，找不到再逐级退让 —— 反过来做的话 "a#b.png" 会先被截成 "a"，
         永远匹配不上，图就丢了。 */
      const cands = [];
      const push = v => { if(v && cands.indexOf(v) < 0) cands.push(v); };
      push(raw);
      push(raw.split('#')[0]);
      push(raw.split('?')[0]);
      push(raw.split('#')[0].split('?')[0]);

      let abs = null, entry = null;
      for(const c of cands){
        let dec = c;
        try{ dec = safeDecode(c); }catch(e){ dec = c; }
        const a = normPath(dirName(file || ''), dec);
        const hit = lookupImage(a);
        if(hit){ abs = a; entry = hit; break; }
      }
      if(!entry) return raw;              // 实在找不到就原样保留，交给输出层转义

      const key = abs.toLowerCase();
      if(usedEntry.has(key)) return 'images/' + usedEntry.get(key);
      const ext = (baseName(entry.abs).match(/\.[^.]+$/) || ['.png'])[0].toLowerCase();
      const out = uniqueName(baseName(entry.abs), ext);
      usedEntry.set(key, out);
      images.set(out, null);
      return 'images/' + out;
    }
  };

  // 逐章转换
  const chunks = [];
  const rawChapters = [];
  let done = 0;
  for(const path of chapterPaths){
    ctx.currentFile = path;
    const key = entries.has(path) ? path
      : [...entries.keys()].find(k => k.toLowerCase() === path.toLowerCase());
    const text = key ? await readText(buf, entries.get(key)) : null;
    rawChapters.push(text || '');
    done++;
    if(done % 5 === 0 || done === chapterPaths.length){
      progSet(done / chapterPaths.length * 70, `读取章节 <b>${done}</b> / ${chapterPaths.length}`);
      /* 让出主线程：解析整章是纯同步的 DOM 活，几章连着跑浏览器就没机会重绘 ——
         进度条定住不动、页面像卡死。paint() 会让浏览器画一帧（内部有节流，不会拖慢转换）。 */
      await paint(done === chapterPaths.length);
    }
    if(text == null) continue;
    let md;
    try{ md = htmlToMarkdown(text, ctx); }
    catch(e){ log(`  [跳过] ${path}：${e.message}`, 'warn'); continue; }
    if(md.trim()) chunks.push(md.trim());
  }

  // 填充图片内容
  let imgDone = 0;
  for(const [absKey, outName] of [...usedEntry.entries()]){
    const entry = lookupImage(absKey);
    if(!entry || images.get(outName)) continue;
    try{
      const k = entries.has(entry.abs) ? entry.abs
        : [...entries.keys()].find(x => x.toLowerCase() === entry.abs.toLowerCase());
      if(k) images.set(outName, await zipRead(buf, entries.get(k)));
    }
    catch(e){ images.delete(outName); }
    imgDone++;
    if(imgDone % 5 === 0 || imgDone === usedEntry.size){
      progSet(70 + imgDone / Math.max(1, usedEntry.size) * 25, `读取插图 <b>${imgDone}</b> / ${usedEntry.size}`);
      await paint(imgDone === usedEntry.size);   // 同上：给浏览器一个重绘的机会
    }
  }

  /* 插图按内容去重。
   *
   *  同一个装饰图（章末分隔线、出版社 logo、公式编号用的小图标）在一本书里
   *  被引用几十次是常态 —— 真实书《现代》里 4827 张图有 71 张内容完全相同，
   *  其中 `image_000.png` 一个文件就出现了 26 次。不去重就是往仓库传 26 个
   *  一模一样的文件：多 25 次 API 请求、多占仓库、README 里也看不出区别。
   *
   *  做法：按 sha1 归并（复用 gitBlobSha1，和上传时算 blob sha 用的是同一套），
   *  重复的名字从 images 里删掉，正文里的引用统一改成指向保留的那一份。 */
  const byHash = new Map(), alias = new Map();
  for(const [name, bytes] of [...images]){
    if(!bytes || !bytes.length) continue;
    let h = '';
    try{ h = gitBlobSha1(bytes); }catch(e){ continue; }
    if(byHash.has(h)) alias.set(name, byHash.get(h));
    else byHash.set(h, name);
  }
  if(alias.size){
    for(const [dup, keep] of alias){
      images.delete(dup);
      const from = 'images/' + dup, to = 'images/' + keep;
      for(let ci = 0; ci < chunks.length; ci++) chunks[ci] = chunks[ci].split(from).join(to);
    }
    log(`  [配图] ${alias.size} 张与已有图内容完全相同，已合并（章节装饰图常见）`, 'info');
  }

  // 拼装：书名 H1 + 元信息 + 各章
  const meta = {
    title: xmlText(opf, 'title'),
    creator: xmlText(opf, 'creator'),
    publisher: xmlText(opf, 'publisher'),
    language: xmlText(opf, 'language')
  };
  const parts = [];
  if(meta.title) parts.push('# ' + meta.title);   // 没有书名就不留一个空的 "#"
  const infoBits = [];
  if(meta.creator) infoBits.push('作者：' + meta.creator);
  if(meta.publisher) infoBits.push('出版社：' + meta.publisher);
  if(meta.language) infoBits.push('语言：' + meta.language);
  if(infoBits.length) parts.push('> ' + infoBits.join('　·　'));

  /* 标题层级只对**正文**归一化，再拼书名。
     混在一起做的话，书名那个 H1 会参与层级序列，把整本书的标题整体压低一级
     （书名 H1→H2、章节 h2→H3、小节 h3→H4）。 */
  const bodyMd = normalizeHeadings(cleanupMd(chunks.join('\n\n---\n\n')));
  if(bodyMd) parts.push(bodyMd);

  let markdown = cleanupMd(parts.join('\n\n'));
  progSet(100, '转换完成');

  const cover = coverItem ? { name: baseName(coverItem.abs), bytes: coverBytes } : null;
  return {
    markdown,
    images: Array.from(images.entries()).filter(([, v]) => v),
    cover,
    meta,
    __chapters: rawChapters
  };
}

/* =========================================================================
   8. GitHub API
   ========================================================================= */
function apiHeaders(token){
  return {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}
/** 把 GitHub 英文报错翻译成人话 */
function explainError(e){
  const st = e && e.status, raw = (e && e.message) || '';
  if(/is at .* but expected|reference does not exist|failed to update ref/i.test(raw))
    return '分支写入冲突（多本书同时上传导致），请等待后重新上传此文件';
  if(st === 401) return 'Token 无效或已过期（请重新生成，勾选 repo 权限）';
  if(st === 403){
    if(/rate limit|secondary/i.test(raw)) return '触发 GitHub 限流，请等待几分钟后重试';
    if(/permission/i.test(raw))        return 'Token 权限不足（需要 repo 权限）';
    return '无权访问该仓库（Token 所属账号不是该仓库所有者）';
  }
  if(st === 404) return '找不到仓库或路径（检查仓库名是否正确）'
    + (e && e.url ? '  ← ' + e.url : '');
  if(st === 409) return '仓库文件冲突（请点一次「读取仓库」刷新后再试）';
  if(st === 413 || /too large|large file/i.test(raw)) return '文件超过 GitHub 单文件 100MB 限制';
  if(st === 422){
    if(/sha wasn't supplied|invalid sha/i.test(raw)) return '文件已存在但缺少更新凭证';
    if(/name.*invalid|path/i.test(raw)) return '路径含 GitHub 不允许的字符';
    return 'GitHub 拒绝了该请求：' + raw;
  }
  if(st === 429) return '请求过于频繁，请稍候重试';
  if(st >= 500) return 'GitHub 服务异常（' + st + '），稍后重试即可';
  if(!st && /Failed to fetch|NetworkError/i.test(raw)) return '网络连接失败，请检查网络后重试';
  return raw;
}
async function gh(token, url, opts = {}){
  let res;
  try{
    res = await fetch(url, { ...opts, headers: { ...apiHeaders(token), ...(opts.headers || {}) } });
  }catch(e){
    const err = new Error('网络请求失败：无法连接 GitHub（检查网络/代理）');
    err.cause = e; throw err;
  }
  const text = await res.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = { message: text }; }
  if(!res.ok){
    const err = new Error((data && data.message) || ('HTTP ' + res.status));
    err.status = res.status; err.data = data;
    err.url = String(url).replace('https://api.github.com', '');
    err.friendly = explainError(err);
    throw err;
  }
  return data;
}
/** 是否值得重试：网络抖动、5xx、限流、ref 竞态 */
function isTransient(err){
  if(!err) return false;
  const m = err.message || '';
  if(/is at .* but expected|reference does not exist|failed to update ref|does not match/i.test(m)) return true;
  if(err.status === 422 && /sha/i.test(m)) return true;
  if(err.status === 429 || err.status >= 500) return true;
  if(!err.status) return /network|fetch|timeout/i.test(m);
  if(err.status === 403 && /rate limit|secondary/i.test(m)) return true;
  return false;
}
async function withRetry(fn, { tries = 3, label = '' } = {}){
  let lastErr;
  for(let i = 1; i <= tries; i++){
    try{ return await fn(i); }
    catch(e){
      lastErr = e;
      if(!isTransient(e) || i === tries) break;
      const wait = 600 * Math.pow(2, i - 1);
      log(`  ${label} 第 ${i} 次失败（${e.friendly || e.message}），${Math.round(wait/1000)} 秒后重试…`, 'warn');
      await sleep(wait);
    }
  }
  throw lastErr;
}
/**
 * 取分支头的 commit sha。
 *
 * 用 /commits/{branch}?per_page=1，不用 /git/ref/heads/x。两个原因：
 *  1) 分支名里带斜杠（feature/x）时，/git/ref/heads/feature%2Fx 这种拼接很容易拼错；
 *     /commits/ 那侧对斜杠和编码宽容得多。
 *  2) 更关键的是**读写的端点不是一个词**：读是单数 /git/ref/，写是复数 /git/refs/。
 *     之前两处 PATCH 照着读接口写成单数，结果移动分支引用永远 404，
 *     README 一个字节都写不进去（而书因为有降级路径照样能传，掩盖了很久）。
 *     现在取头统一走这个函数，PATCH 一律用复数，不再有"照着上一行抄错"的机会。
 * 它同时接受分支名、tag、sha。
 * 分支名对不上时（仓库改过默认分支）再问一次仓库并重试。
 */
async function readHeadRef(token, base, info){
  const repoBase = base.replace(/\/git$/, '');
  const tryHead = async b => {
    const list = await gh(token, `${repoBase}/commits/${encodeURIComponent(b)}?per_page=1`);
    if(!Array.isArray(list) || !list.length){
      const e = new Error(`分支 ${b} 上没有任何提交`);
      e.status = 404;
      throw e;
    }
    return list[0].sha;
  };
  try{
    return await tryHead(info.default_branch);
  }catch(e){
    if(e.status !== 404) throw e;
    const fresh = await gh(token, repoBase);
    const b = fresh && fresh.default_branch;
    if(b && b !== info.default_branch){
      log(`  默认分支实际是 ${b}（原以为 ${info.default_branch}），改用 ${b}`, 'warn');
      info.default_branch = b;
      return tryHead(b);
    }
    throw e;
  }
}

/** 串行化：所有移动分支引用的操作排队，避免 ref 竞态 */
let writeQueue = Promise.resolve();
function serialize(fn){
  const run = writeQueue.then(fn, fn);
  writeQueue = run.then(() => {}, () => {});
  return run;
}

async function repoInfo(token, repoInput){
  const s = (repoInput || '').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  if(!s) throw new Error('请填写仓库名');
  let owner, name;
  if(s.includes('/')){ const p = s.split('/'); owner = p[0]; name = p[1]; }
  else { owner = (await gh(token, 'https://api.github.com/user')).login; name = s; }
  const full = owner + '/' + name;
  const r = await gh(token, `https://api.github.com/repos/${full}`);
  return { owner, repo: name, full, default_branch: r.default_branch || 'main', created: false };
}
async function ensureRepo(token, repoInput, isPrivate){
  try{ return await repoInfo(token, repoInput); }
  catch(e){
    if(e.status !== 404) throw e;
    log(`仓库不存在，尝试创建…`, 'info');
    const s = (repoInput || '').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
    let owner, name;
    if(s.includes('/')){ const p = s.split('/'); owner = p[0]; name = p[1]; }
    else { owner = (await gh(token, 'https://api.github.com/user')).login; name = s; }
    await gh(token, 'https://api.github.com/user/repos', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, private: !!isPrivate, auto_init: true })
    });
    const info = await repoInfo(token, owner + '/' + name);
    info.created = true;
    return info;
  }
}
async function listPaths(token, info){
  try{
    const r = await withRetry(
      () => gh(token, `https://api.github.com/repos/${info.full}/git/trees/${info.default_branch}?recursive=1`),
      { tries: 3, label: '读取文件列表' }
    );
    return new Map((r.tree || []).filter(n => n.type === 'blob').map(n => [n.path, n.sha]));
  }catch(e){
    if(e.status === 409 || /too large|truncated/i.test(e.message || ''))
      log('仓库文件过多，整树接口被截断，改为逐文件校验', 'warn');
    else
      log(`读取文件列表失败（${e.friendly || e.message}），将逐个校验文件是否存在`, 'warn');
    return null;
  }
}
async function listAllFiles(token, info){
  try{
    const r = await withRetry(
      () => gh(token, `https://api.github.com/repos/${info.full}/git/trees/${info.default_branch}?recursive=1`),
      { tries: 3, label: '读取文件列表' }
    );
    return (r.tree || []).filter(n => n.type === 'blob')
      .map(n => ({ path: n.path, size: n.size || 0, sha: n.sha || '' }));
  }catch(e){ return []; }
}

/**
 * 读仓库里某个文本文件。
 * 有 sha 时走 git/blobs（一次请求、不占 contents 的 rate limit）；
 * 只有确实不知道 sha 才退回 contents 接口。
 */
async function readRepoText(token, info, path, sha){
  let b64 = '';
  if(sha){
    const blob = await gh(token, `https://api.github.com/repos/${info.full}/git/blobs/${sha}`);
    b64 = String(blob.content || '').replace(/\s+/g, '');
  }else{
    const url = `https://api.github.com/repos/${info.full}/contents/` +
      path.split('/').map(encodeURIComponent).join('/') +
      `?ref=${encodeURIComponent(info.default_branch)}`;
    const r = await gh(token, url);
    b64 = String((r && r.content) || '').replace(/\s+/g, '');
  }
  if(!b64) return '';
  return new TextDecoder().decode(b64ToBytes(b64));
}

/* =========================================================================
   9. 上传：并发 blob + 跳过未变更文件
   ========================================================================= */
/**
 * 批量提交：整本书合并成 1 个 commit。
 *
 * 速度的两个关键：
 *  1) blob **并发**创建（CONC=6）。blob 是内容寻址的，不移动分支引用。
 *     之前逐个串行，300 张图要 300 次往返（30-90 秒）；并发后只要 300/6 次。
 *  2) **跳过内容未变的文件**。上传前本地算 git blob sha，与仓库里已有的比对，
 *     相同说明那个 blob 已在 GitHub 上，一个字节都不用传。
 *
 * 除了"新建 blob"，同一棵树里还可以顺带做两件事（extra）：
 *  - extra.refs：[{path, sha}] 直接指向**仓库里已有的 blob**，用来改名/移动文件，
 *    一个字节都不用重传——GitHub 的 tree 条目本来就支持按 sha 引用。
 *  - extra.dels：[path] 删除文件，tree 条目里把 sha 写成 null 即可。
 *    注意不能"省略不写"：base_tree 会把它原样带回来，等于没删。
 */
async function commitFilesBatch(token, info, entries, commitMessage, extra){
  const base = `https://api.github.com/repos/${info.full}/git`;

  /* 自适应并发（AIMD：加性增、乘性减）。
   *
   *  固定并发要么太慢（请求排队），要么被 GitHub 二次限流罚到更慢。
   *  实测 300 文件 / 40ms 往返：固定 6 → 2201ms；固定 16 → 852ms；
   *  但固定 16 一旦限流就要大量重试，收益被吃掉。
   *
   *  做法：起点给高（12），持续成功就缓慢加档；一旦被限流立刻砍半并退避。
   *  用「分片 + Promise.all」实现 —— 每片内部固定并发、片与片之间可控，
   *  避免动态增减 worker 带来的计数/退出竞态。
   */
  const SLICE = 12;          // 每片并发数
  const MIN_SLICE = 3, MAX_SLICE = 24;
  let slice = SLICE, streak = 0;
  let doneAll = 0;
  const blobs = [];

  const uploadSlice = async (chunk) => {
    const out = [];
    let c = 0;
    const worker = async () => {
      while(true){
        let i = c++;
        if (i >= chunk.length) return;
        const e = chunk[i];
        try{
          // 限流错误直接冒到这里，不交给 withRetry —— 因为限流要靠"降低并发"
          // 才能根治，单纯重试只会继续撞墙。
          const res2 = await gh(token, base + '/blobs', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: e.b64, encoding: 'base64' })
          });
          out.push({ path: e.path, mode: '100644', type: 'blob', sha: res2.sha });
          doneAll++;
          progSet(doneAll / entries.length * 85,
            `${progState.text} · 上传文件 <b>${doneAll}</b> / ${entries.length}`);
        }catch(err){
          const msg = (err.friendly || '') + ' ' + (err.message || '');
          if(/rate limit|secondary|abuse|forbidden|限流/i.test(msg)){
            // 被限流：并发砍半并退避。单纯重试只会继续撞墙，降并发才能根治。
            slice = Math.max(MIN_SLICE, Math.floor(slice / 2));
            streak = 0;
            log(`  GitHub 限流，并发降到 ${slice}`, 'warn');
            await sleep(2000);
            // 降并发后就地重试当前文件（不再塞回队列，避免索引错乱）
            for(let attempt = 1; attempt <= 3; attempt++){
              try{
                const again = await gh(token, base + '/blobs', {
                  method: 'POST', headers: { 'Content-Type': 'application/json' },
